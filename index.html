<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수학 과제 앱 공간</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --paper:#F4EDDD; --paper2:#FCFAF3; --ink:#1A1A1A; --ink2:#5B5348;
    --line:#DCCFB4; --blue:#1B4965; --terra:#B7410E; --gold:#A8541E;
    --font: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif;
    --mono: 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
  }
  body { font-family: var(--font); background: var(--paper); color: var(--ink);
    min-height: 100vh; padding: 18px 14px 60px; -webkit-tap-highlight-color: transparent; }
  .wrap { max-width: 880px; margin: 0 auto; }
  .brand { display: flex; align-items: baseline; gap: 10px; margin-bottom: 18px; }
  .brand h1 { font-size: 20px; letter-spacing: -.4px; }
  .brand span { font-size: 11px; color: var(--ink2); font-family: var(--mono); letter-spacing: .5px; }

  .card { background: var(--paper2); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px; margin-bottom: 14px; }
  .card h2 { font-size: 15px; margin-bottom: 4px; }
  .hint { font-size: 12.5px; color: var(--ink2); margin-bottom: 14px; line-height: 1.6; }

  .hero { border: 1px solid var(--line); border-left: 4px solid var(--terra); background: var(--paper2);
    border-radius: 12px; padding: 28px 22px; margin-bottom: 16px; }
  .hero h2 { font-size: 26px; line-height: 1.35; letter-spacing: -.8px; margin-bottom: 10px; }
  .hero p { font-size: 13.5px; color: var(--ink2); line-height: 1.75; margin-bottom: 18px; max-width: 52ch; }
  .steps { display: grid; gap: 8px; }
  .steps div { font-size: 13px; color: var(--ink2); display: flex; gap: 10px; align-items: baseline; }

  label { display: block; font-size: 12px; font-weight: 600; color: var(--ink2); margin-bottom: 5px; }
  input[type=text], textarea { width: 100%; font-family: var(--font); font-size: 16px; color: var(--ink);
    background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px 11px;
    outline: none; margin-bottom: 12px; }
  textarea { font-family: var(--mono); font-size: 12.5px; line-height: 1.5; min-height: 180px; resize: vertical; }
  input:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(27,73,101,.12); }

  button { font-family: var(--font); cursor: pointer; border-radius: 8px; font-size: 14px;
    font-weight: 600; padding: 10px 16px; border: 1px solid transparent; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .btn-p { background: var(--blue); color: #fff; }
  .btn-s { background: transparent; color: var(--blue); border-color: var(--line); }
  .btn-g { background: var(--terra); color: #fff; }
  .btn-d { background: transparent; color: var(--terra); border-color: var(--line); font-size: 12.5px; padding: 7px 12px; }
  .btn-google { background: #fff; color: var(--ink); border-color: var(--line); display: inline-flex;
    align-items: center; gap: 9px; }
  .btn-google svg { width: 17px; height: 17px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .between { display: flex; justify-content: space-between; align-items: center; gap: 10px;
    flex-wrap: wrap; margin-bottom: 14px; }

  .code-chip { font-family: var(--mono); font-size: 22px; letter-spacing: 4px; font-weight: 700;
    color: var(--blue); background: #fff; border: 1px dashed var(--blue); border-radius: 8px;
    padding: 8px 14px; display: inline-block; }
  .code-sm { font-family: var(--mono); font-size: 13px; letter-spacing: 2px; font-weight: 700;
    color: var(--blue); background: #fff; border: 1px dashed var(--blue); border-radius: 6px; padding: 5px 9px; }
  .linkbox { font-family: var(--mono); font-size: 11.5px; color: var(--ink2); background: #fff;
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 10px; overflow-wrap: anywhere; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; flex-wrap: wrap; }
  .tab { background: none; border: none; padding: 9px 13px; font-size: 13.5px; color: var(--ink2);
    border-bottom: 2px solid transparent; border-radius: 0; }
  .tab.on { color: var(--blue); border-bottom-color: var(--blue); }

  .item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: none; }
  .grow { flex: 1; min-width: 0; }
  .t { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
  .m { font-size: 11.5px; color: var(--ink2); font-family: var(--mono); margin-top: 2px; }
  .num { font-family: var(--mono); font-size: 11px; color: var(--gold); font-weight: 700; }
  .fold { display: flex; justify-content: space-between; align-items: baseline;
    font-size: 13px; font-weight: 700; color: var(--blue); padding: 15px 0 7px;
    border-bottom: 1px solid var(--line); }
  .fold:first-of-type { padding-top: 2px; }
  .fold b { font-weight: 400; font-size: 11.5px; color: var(--ink2); font-family: var(--mono); }
  .dayhead { display: flex; justify-content: space-between; align-items: baseline;
    font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--gold);
    letter-spacing: .3px; padding: 16px 0 7px; border-bottom: 1px solid var(--line); }
  .dayhead:first-of-type { padding-top: 4px; }
  .dayhead b { font-weight: 400; color: var(--ink2); }
  .empty { text-align: center; padding: 28px 12px; color: var(--ink2); font-size: 13px; line-height: 1.7; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .thumb { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff;
    cursor: pointer; padding: 0; display: block; width: 100%; text-align: left; }
  .thumb img { width: 100%; height: 104px; object-fit: cover; display: block; background: #EFE7D6; }
  .thumb .cap { padding: 7px 8px; }
  .thumb .cap b { font-size: 12.5px; display: block; }
  .thumb .cap i { font-size: 10.5px; color: var(--ink2); font-style: normal;
    font-family: var(--mono); display: block; }

  .drop { border: 2px dashed var(--line); border-radius: 10px; background: #fff; padding: 22px 14px;
    text-align: center; font-size: 13px; color: var(--ink2); line-height: 1.7; margin-bottom: 12px; }
  .drop.hot { border-color: var(--blue); background: #F7FAFC; }

  iframe.frame { width: 100%; height: 84vh; min-height: 540px; border: 1px solid var(--line);
    border-radius: 10px; background: #fff; }
  .modal iframe.frame { height: 80vh; }
  .thumb .open { cursor: pointer; }
  .thumb .foot { padding: 0 8px 8px; }
  .toggle { width: 100%; display: flex; justify-content: space-between; align-items: center; }
  .toggle span { font-size: 12px; font-weight: 400; }
  .modal { position: fixed; inset: 0; background: rgba(26,26,26,.78); display: flex;
    align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .mbox { max-width: 760px; width: 100%; text-align: center; }
  .mbox p { color: #fff; font-size: 13px; margin: 10px 0 14px; font-family: var(--mono); overflow-wrap: anywhere; }
  .mbox img { max-width: 100%; max-height: 76vh; border-radius: 8px; background: #fff; }

  .err { color: var(--terra); font-size: 12.5px; margin: -4px 0 10px; font-weight: 600; }
  .ok { color: var(--blue); font-size: 12.5px; margin: -4px 0 10px; font-weight: 600; }
  .banner { background: #fff; border: 1px solid var(--line); border-left: 3px solid var(--gold);
    border-radius: 8px; padding: 10px 12px; font-size: 12.5px; color: var(--ink2);
    line-height: 1.6; margin-bottom: 14px; }
  .banner code { font-family: var(--mono); font-size: 11.5px; color: var(--terra); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><h1>수학 과제 앱 공간</h1><span>MATH TASK HUB</span></div>
  <div id="app"><div class="card"><div class="empty">불러오는 중…</div></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ══════════════════════════════════════════════════════════
   ① 아래 두 줄만 본인 Supabase 프로젝트 값으로 바꾸세요.
      대시보드 → Project Settings → API 에서 확인합니다.
   ══════════════════════════════════════════════════════════ */
var SUPABASE_URL = "https://kbxmeeeibgimucprkohf.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtieG1lZWVpYmdpbXVjcHJrb2hmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczODU1NTYsImV4cCI6MjEwMjk2MTU1Nn0.wlNf3qarkCQVfTm_gQcsiTMSoZqrdURpw8ufgfW1vX4";
/* ══════════════════════════════════════════════════════════ */

var sb = null;
var app = document.getElementById("app");
var ST = { user: null, spaces: [], space: null, apps: [], student: "", tab: "apps" };

/* ── 도우미 ─────────────────────────────────────────────── */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function fmt(iso) {
  var d = new Date(iso), p = function (n) { return String(n).padStart(2, "0"); };
  return p(d.getMonth() + 1) + "/" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
function hm(iso) {
  var d = new Date(iso), p = function (n) { return String(n).padStart(2, "0"); };
  return p(d.getHours()) + ":" + p(d.getMinutes());
}
var WD = ["일", "월", "화", "수", "목", "금", "토"];
function dayLabel(iso) {
  var d = new Date(iso), t = new Date();
  var same = d.getFullYear() === t.getFullYear() && d.getMonth() === t.getMonth() && d.getDate() === t.getDate();
  return (d.getMonth() + 1) + "월 " + d.getDate() + "일 (" + WD[d.getDay()] + ")" + (same ? " · 오늘" : "");
}
function groupByFolder(rows) {
  var named = [], plain = [], map = {};
  rows.forEach(function (r) {
    var f = (r.folder || "").trim();
    if (!f) { plain.push(r); return; }
    if (!map[f]) { map[f] = { label: f, rows: [] }; named.push(map[f]); }
    map[f].rows.push(r);
  });
  named.sort(function (a, b) { return a.label.localeCompare(b.label, "ko"); });
  if (plain.length) named.push({ label: "폴더 없음", rows: plain });
  return named;
}
function groupByDay(rows) {
  var out = [], map = {};
  rows.forEach(function (r) {
    var d = new Date(r.created_at);
    var k = d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate();
    if (!map[k]) { map[k] = { label: dayLabel(r.created_at), rows: [] }; out.push(map[k]); }
    map[k].rows.push(r);
  });
  return out;
}
function render(html) { app.innerHTML = html; window.scrollTo(0, 0); }
function $(sel) { return app.querySelector(sel); }
function on(sel, ev, fn) { var e = $(sel); if (e) e.addEventListener(ev, fn); }
function setErr(msg) { var e = $("#err"); if (e) e.textContent = msg || ""; }

var ALPH = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function mkCode() {
  var s = "";
  for (var i = 0; i < 5; i++) s += ALPH[Math.floor(Math.random() * ALPH.length)];
  return s;
}
function extractCode(raw) {
  var s = String(raw || "").trim().toUpperCase();
  var m = s.match(/[?&#]C=([A-Z0-9]{5})/);
  if (m) return m[1];
  var t = s.replace(/[^A-Z0-9]/g, "");
  return t.length > 5 ? t.slice(-5) : t;
}
function shareLink(code) {
  return location.origin + location.pathname + "?c=" + code;
}
function copy(text, btn) {
  navigator.clipboard.writeText(text).then(function () {
    var old = btn.textContent;
    btn.textContent = "복사했습니다";
    setTimeout(function () { btn.textContent = old; }, 1600);
  }).catch(function () { });
}
function goHome() { history.replaceState(null, "", location.pathname); boot(); }

/* 캡처 이미지 줄이기 → JPEG Blob */
function compress(file) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var max = 1400, scale = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      var ctx = c.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function (b) { b ? resolve(b) : reject(new Error("이미지를 만들지 못했습니다")); }, "image/jpeg", 0.82);
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("이미지를 읽을 수 없습니다")); };
    img.src = url;
  });
}

/* iframe 에 과제 HTML 넣기 (innerHTML 로 넣지 않습니다) */
function mountFrame(holderSel, html, title) {
  var holder = $(holderSel);
  if (!holder) return;
  holder.innerHTML = "";
  var f = document.createElement("iframe");
  f.className = "frame";
  f.title = title || "과제";
  f.setAttribute("sandbox", "allow-scripts allow-forms allow-modals allow-popups");
  f.setAttribute("allowfullscreen", "");
  f.srcdoc = html;
  holder.appendChild(f);
}

/* 캡처 받기 (고르기 / 붙여넣기 / 끌어놓기) */
function wirePicker(onPick) {
  var drop = $("#drop"), input = $("#file"), btn = $("#pick");
  if (!drop) return;
  var take = function (f) { if (f && f.type.indexOf("image/") === 0) onPick(f); };
  drop.addEventListener("dragover", function (e) { e.preventDefault(); drop.classList.add("hot"); });
  drop.addEventListener("dragleave", function () { drop.classList.remove("hot"); });
  drop.addEventListener("drop", function (e) {
    e.preventDefault(); drop.classList.remove("hot"); take(e.dataTransfer.files[0]);
  });
  document.addEventListener("paste", function (e) {
    if (!document.body.contains(drop) || !drop.offsetParent) return;
    var items = e.clipboardData ? e.clipboardData.items : [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].type.indexOf("image/") === 0) { take(items[i].getAsFile()); break; }
    }
  });
  btn.addEventListener("click", function () { input.click(); });
  input.addEventListener("change", function () { take(input.files[0]); input.value = ""; });
}

/* ── 시작 ───────────────────────────────────────────────── */
function boot() {
  if (SUPABASE_URL.indexOf("여기에") >= 0 || SUPABASE_ANON_KEY.indexOf("여기에") >= 0) {
    return render(
      '<div class="card"><h2>설정이 남았습니다</h2>' +
      '<p class="hint">index.html 위쪽 <code>SUPABASE_URL</code> 과 <code>SUPABASE_ANON_KEY</code> 를 ' +
      '본인 Supabase 프로젝트 값으로 바꾼 뒤 다시 올려 주세요. ' +
      'Supabase 대시보드 → Project Settings → API 에 있습니다.</p></div>');
  }
  if (!sb) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var code = (new URLSearchParams(location.search).get("c") || "").toUpperCase();
  if (code.length === 5) return studentEnter(code);

  sb.auth.getSession().then(function (r) {
    ST.user = r.data.session ? r.data.session.user : null;
    ST.user ? viewSpaces() : viewHome();
  });
}

/* ── 첫 화면 ────────────────────────────────────────────── */
function viewHome() {
  render(
    '<div class="hero">' +
      '<h2>자신이 만든 과제를 배포하세요</h2>' +
      '<p>만든 HTML 활동을 과제 공간에 올리면 학생은 코드나 링크 하나로 들어옵니다. ' +
      '누가 언제 들어왔는지, 무엇을 제출했는지가 공간마다 따로 쌓입니다.</p>' +
      '<button class="btn-google" id="login">' +
        '<svg viewBox="0 0 48 48"><path fill="#4285F4" d="M45 24c0-1.6-.1-2.7-.4-4H24v7.5h12c-.2 2-1.5 5-4.4 7l6.7 5.2C42.2 36 45 30.6 45 24z"/>' +
        '<path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.3l-6.9-5.4c-1.9 1.3-4.4 2.2-7.6 2.2-5.8 0-10.7-3.9-12.5-9.2l-7.1 5.5C8 40.4 15.4 46 24 46z"/>' +
        '<path fill="#FBBC05" d="M11.5 28.3c-.5-1.4-.8-2.8-.8-4.3s.3-3 .8-4.3l-7.1-5.5C2.9 17.1 2 20.4 2 24s.9 6.9 2.4 9.8l7.1-5.5z"/>' +
        '<path fill="#EA4335" d="M24 10.7c3.2 0 5.4 1.4 6.7 2.6l5.9-5.8C33 4.1 29.9 2 24 2 15.4 2 8 7.6 4.4 14.2l7.1 5.5c1.8-5.3 6.7-9 12.5-9z"/></svg>' +
        '구글 계정으로 시작하기</button>' +
    '</div>' +
    '<div class="card">' +
      '<h2>학생은 여기로</h2>' +
      '<p class="hint">선생님이 준 5자리 코드를 넣거나, 받은 링크를 그대로 붙여넣으세요.</p>' +
      '<input type="text" id="entry" placeholder="ABCDE 또는 https://…?c=ABCDE">' +
      '<div class="err" id="err"></div>' +
      '<button class="btn-g" id="join">과제 공간 들어가기</button>' +
    '</div>' +
    '<div class="card"><div class="steps">' +
      '<div><span class="num">01</span> 구글 계정으로 들어와 과제 공간을 하나 엽니다</div>' +
      '<div><span class="num">02</span> 제목과 HTML을 넣어 과제를 추가합니다</div>' +
      '<div><span class="num">03</span> 코드나 링크를 학생에게 알려 줍니다</div>' +
      '<div><span class="num">04</span> 접속 기록과 제출된 캡처를 확인합니다</div>' +
    '</div></div>');

  on("#login", "click", function () {
    sb.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: location.origin + location.pathname }
    });
  });
  var join = function () {
    var c = extractCode($("#entry").value);
    if (c.length !== 5) return setErr("5자리 코드나 선생님이 준 링크를 넣어 주세요.");
    location.search = "?c=" + c;
  };
  on("#join", "click", join);
  on("#entry", "keydown", function (e) { if (e.key === "Enter") join(); });
}

/* ── 교사: 공간 목록 ────────────────────────────────────── */
function viewSpaces() {
  render('<div class="card"><div class="empty">공간을 불러오는 중…</div></div>');
  sb.from("spaces").select("*").order("created_at", { ascending: false }).then(function (r) {
    ST.spaces = r.data || [];
    var rows = ST.spaces.length
      ? ST.spaces.map(function (s) {
          return '<div class="item">' +
            '<span class="code-sm">' + esc(s.code) + '</span>' +
            '<div class="grow"><div class="t">' + esc(s.title) + '</div>' +
            '<div class="m">' + fmt(s.created_at) + ' 개설</div></div>' +
            '<button class="btn-s link" data-code="' + esc(s.code) + '">링크</button>' +
            '<button class="btn-p open" data-code="' + esc(s.code) + '">열기</button>' +
            '<button class="btn-d del" data-code="' + esc(s.code) + '">삭제</button>' +
            '</div>';
        }).join("")
      : '<div class="empty">아직 만든 공간이 없습니다.<br>아래에서 첫 공간을 만들어 보세요.</div>';

    render(
      '<div class="between">' +
        '<button class="btn-s" id="out">← 로그아웃</button>' +
        '<span class="m">' + esc(ST.user.email) + '</span></div>' +
      '<div class="card"><h2>내 과제 공간 <span class="num">' + ST.spaces.length + '</span></h2>' +
        '<p class="hint">공간마다 코드가 따로 있습니다. 학급이나 단원별로 나눠 쓰세요.</p>' + rows + '</div>' +
      '<div class="card"><h2>새 공간 만들기</h2>' +
        '<p class="hint">이름만 정하면 5자리 코드가 바로 생깁니다.</p>' +
        '<label>공간 이름</label>' +
        '<input type="text" id="title" placeholder="예: 2학년 3반 일차함수">' +
        '<div class="err" id="err"></div>' +
        '<button class="btn-p" id="make">공간 만들기</button></div>');

    on("#out", "click", function () { sb.auth.signOut().then(function () { ST.user = null; viewHome(); }); });
    on("#make", "click", createSpace);
    app.querySelectorAll(".open").forEach(function (b) {
      b.addEventListener("click", function () { openSpace(b.dataset.code); });
    });
    app.querySelectorAll(".link").forEach(function (b) {
      b.addEventListener("click", function () { copy(shareLink(b.dataset.code), b); });
    });
    app.querySelectorAll(".del").forEach(function (b) {
      b.addEventListener("click", function () {
        if (b.textContent === "삭제") { b.textContent = "정말 삭제"; return; }
        sb.from("spaces").delete().eq("code", b.dataset.code).then(viewSpaces);
      });
    });
  });
}

function createSpace() {
  var title = $("#title").value.trim();
  if (!title) return setErr("공간 이름을 입력하세요.");
  var btn = $("#make");
  btn.disabled = true; setErr("");
  var name = ST.user.user_metadata && ST.user.user_metadata.full_name || "";

  var attempt = function (n) {
    var code = mkCode();
    sb.from("spaces").insert({ code: code, owner: ST.user.id, title: title, teacher_name: name })
      .then(function (r) {
        if (r.error) {
          if (r.error.code === "23505" && n < 5) return attempt(n + 1);
          btn.disabled = false;
          return setErr("공간을 만들지 못했습니다: " + r.error.message);
        }
        viewSpaces();
      });
  };
  attempt(0);
}

/* ── 교사: 공간 대시보드 ────────────────────────────────── */
function openSpace(code) {
  var sp = ST.spaces.filter(function (s) { return s.code === code; })[0];
  ST.space = sp; ST.tab = "apps";
  viewDash();
}

function viewDash() {
  var sp = ST.space;
  render(
    '<div class="between">' +
      '<button class="btn-s" id="back">← 내 공간 목록</button>' +
      '<span class="m">' + esc(ST.user.email) + '</span></div>' +
    '<div class="card"><h2>' + esc(sp.title) + '</h2>' +
      '<p class="hint">코드를 알려 주거나 링크를 보내세요. 링크로 들어온 학생은 코드를 입력하지 않아도 됩니다.</p>' +
      '<div class="row"><span class="code-chip">' + esc(sp.code) + '</span>' +
      '<button class="btn-s" id="cpCode">코드 복사</button>' +
      '<button class="btn-s" id="cpLink">링크 복사</button>' +
      '<button class="btn-s" id="openLink">링크 열기</button></div>' +
      '<div class="linkbox">' + esc(shareLink(sp.code)) + '</div></div>' +
    '<div class="tabs">' +
      '<button class="tab' + (ST.tab === "apps" ? " on" : "") + '" data-tab="apps">과제 앱</button>' +
      '<button class="tab' + (ST.tab === "log" ? " on" : "") + '" data-tab="log">접속 기록</button>' +
      '<button class="tab' + (ST.tab === "sub" ? " on" : "") + '" data-tab="sub">제출 결과</button>' +
    '</div><div id="panel"><div class="card"><div class="empty">불러오는 중…</div></div></div>');

  on("#back", "click", viewSpaces);
  on("#cpCode", "click", function (e) { copy(sp.code, e.target); });
  on("#cpLink", "click", function (e) { copy(shareLink(sp.code), e.target); });
  on("#openLink", "click", function () { window.open(shareLink(sp.code), "_blank"); });
  app.querySelectorAll(".tab").forEach(function (b) {
    b.addEventListener("click", function () { ST.tab = b.dataset.tab; viewDash(); });
  });

  if (ST.tab === "apps") panelApps();
  else if (ST.tab === "log") panelLog();
  else panelSubs();
}

function panelApps() {
  sb.from("apps").select("id,title,created_at,folder").eq("space_code", ST.space.code)
    .order("created_at").then(function (r) {
      ST.apps = r.data || [];
      var n = 0;
      var rows = ST.apps.length
        ? groupByFolder(ST.apps).map(function (g) {
            return '<div class="fold">' + esc(g.label) + '<b>' + g.rows.length + '개</b></div>' +
              g.rows.map(function (a) {
                n++;
                return '<div class="item"><span class="num">' + String(n).padStart(2, "0") + '</span>' +
                  '<div class="grow"><div class="t">' + esc(a.title) + '</div>' +
                  '<div class="m">' + fmt(a.created_at) + ' 등록</div></div>' +
                  '<button class="btn-s move" data-id="' + a.id + '" data-f="' + esc(a.folder || "") + '">폴더</button>' +
                  '<button class="btn-s prev" data-id="' + a.id + '">미리보기</button>' +
                  '<button class="btn-d del" data-id="' + a.id + '">삭제</button></div>';
              }).join("");
          }).join("")
        : '<div class="empty">아직 과제가 없습니다.<br>아래에서 첫 과제를 올려 보세요.</div>';

      var folders = [];
      ST.apps.forEach(function (a) {
        var f = (a.folder || "").trim();
        if (f && folders.indexOf(f) < 0) folders.push(f);
      });

      $("#panel").innerHTML =
        '<div class="card"><h2>등록된 과제 <span class="num">' + ST.apps.length + '</span></h2>' + rows + '</div>' +
        '<div class="card"><h2>과제 추가</h2>' +
          '<p class="hint">HTML 파일 하나로 된 활동을 그대로 올립니다. 코드를 붙여넣거나 .html 파일을 고르세요.</p>' +
          '<label>과제 제목</label><input type="text" id="atitle" placeholder="예: 활동 1 — 일차함수의 그래프">' +
          '<label>폴더 (선택 — 비워 두면 폴더 없음)</label>' +
          '<input type="text" id="afolder" list="flist" placeholder="예: 1학기 · 함수 단원">' +
          '<datalist id="flist">' + folders.map(function (f) {
            return '<option value="' + esc(f) + '">';
          }).join("") + '</datalist>' +
          '<label>HTML 코드</label><textarea id="ahtml" placeholder="&lt;!DOCTYPE html&gt; …"></textarea>' +
          '<div class="row"><button class="btn-s" id="pickfile">.html 파일 고르기</button>' +
          '<button class="btn-p" id="addapp">과제 추가</button></div>' +
          '<input type="file" id="hfile" accept=".html,.htm,text/html" style="display:none">' +
          '<div class="err" id="err" style="margin-top:10px"></div></div>' +
        '<div id="modal"></div>';

      on("#pickfile", "click", function () { $("#hfile").click(); });
      on("#hfile", "change", function (e) {
        var f = e.target.files[0]; if (!f) return;
        var rd = new FileReader();
        rd.onload = function () {
          $("#ahtml").value = String(rd.result);
          if (!$("#atitle").value) $("#atitle").value = f.name.replace(/\.html?$/i, "");
        };
        rd.readAsText(f); e.target.value = "";
      });
      on("#addapp", "click", function () {
        var title = $("#atitle").value.trim(), html = $("#ahtml").value;
        var folder = $("#afolder").value.trim();
        if (!title) return setErr("과제 제목을 입력하세요.");
        if (!html.trim()) return setErr("HTML 코드를 붙여넣거나 파일을 고르세요.");
        var btn = $("#addapp"); btn.disabled = true; setErr("");
        sb.from("apps").insert({ space_code: ST.space.code, title: title, html: html, folder: folder || null })
          .then(function (r) {
            btn.disabled = false;
            if (r.error) return setErr("저장하지 못했습니다: " + r.error.message);
            panelApps();
          });
      });
      app.querySelectorAll(".move").forEach(function (b) {
        b.addEventListener("click", function () {
          var cur = b.dataset.f || "";
          var next = window.prompt("옮길 폴더 이름을 적으세요.\n비워 두면 폴더 없음으로 갑니다." +
            (folders.length ? "\n\n지금 있는 폴더: " + folders.join(", ") : ""), cur);
          if (next === null) return;
          next = next.trim();
          sb.from("apps").update({ folder: next || null }).eq("id", b.dataset.id).then(function (r) {
            if (r.error) return alert("옮기지 못했습니다: " + r.error.message);
            panelApps();
          });
        });
      });

      app.querySelectorAll(".prev").forEach(function (b) {
        b.addEventListener("click", function () { previewApp(b.dataset.id); });
      });
      app.querySelectorAll("#panel .del").forEach(function (b) {
        b.addEventListener("click", function () {
          if (b.textContent === "삭제") { b.textContent = "정말 삭제"; return; }
          sb.from("apps").delete().eq("id", b.dataset.id).then(panelApps);
        });
      });
    });
}

function previewApp(id) {
  sb.from("apps").select("title,html").eq("id", id).single().then(function (r) {
    if (!r.data) return;
    $("#modal").innerHTML =
      '<div class="modal"><div class="mbox"><p>' + esc(r.data.title) + '</p>' +
      '<div id="holder"></div><div style="margin-top:12px">' +
      '<button class="btn-p" id="close">닫기</button></div></div></div>';
    mountFrame("#holder", r.data.html, r.data.title);
    on("#close", "click", function () { $("#modal").innerHTML = ""; });
  });
}

function panelLog() {
  sb.from("visits").select("id,student_name,created_at").eq("space_code", ST.space.code)
    .order("created_at", { ascending: false }).limit(300).then(function (r) {
      var rows = (r.data || []);
      $("#panel").innerHTML =
        '<div class="card"><h2>접속 기록 <span class="num">' + rows.length + '</span></h2>' +
        '<p class="hint">학생이 이름을 넣고 들어온 시각입니다. 삭제는 두 번 눌러야 지워집니다.</p>' +
        (rows.length
          ? groupByDay(rows).map(function (g) {
              return '<div class="dayhead">' + esc(g.label) + '<b>' + g.rows.length + '명</b></div>' +
                g.rows.map(function (v) {
                  return '<div class="item"><div class="grow"><div class="t">' + esc(v.student_name) + '</div></div>' +
                    '<div class="m">' + hm(v.created_at) + '</div>' +
                    '<button class="btn-d vdel" data-id="' + v.id + '">삭제</button></div>';
                }).join("");
            }).join("")
          : '<div class="empty">아직 들어온 학생이 없습니다.</div>') + '</div>';

      app.querySelectorAll(".vdel").forEach(function (b) {
        b.addEventListener("click", function () {
          if (b.textContent === "삭제") { b.textContent = "정말 삭제"; return; }
          b.disabled = true;
          sb.from("visits").delete().eq("id", b.dataset.id).then(function (r) {
            if (r.error) { b.disabled = false; b.textContent = "삭제"; alert("지우지 못했습니다: " + r.error.message); return; }
            panelLog();
          });
        });
      });
    });
}

function panelSubs() {
  sb.from("submissions").select("*").eq("space_code", ST.space.code)
    .order("created_at", { ascending: false }).limit(300).then(function (r) {
      var rows = r.data || [];
      var url = function (p) { return sb.storage.from("submissions").getPublicUrl(p).data.publicUrl; };
      $("#panel").innerHTML =
        '<div class="card"><h2>제출 결과 <span class="num">' + rows.length + '</span></h2>' +
        '<p class="hint">학생이 보낸 캡처입니다. 눌러서 크게 볼 수 있고, 삭제는 두 번 눌러야 지워집니다.</p>' +
        (rows.length
          ? groupByDay(rows).map(function (g) {
              return '<div class="dayhead">' + esc(g.label) + '<b>' + g.rows.length + '건</b></div>' +
                '<div class="grid" style="margin-top:10px">' + g.rows.map(function (s) {
                  return '<div class="thumb"><div class="open" data-p="' + esc(s.image_path) + '" data-n="' +
                    esc(s.student_name + " · " + (s.app_title || "") + " · " + fmt(s.created_at) +
                    (s.note ? " · " + s.note : "")) + '">' +
                    '<img loading="lazy" src="' + esc(url(s.image_path)) + '" alt="제출 캡처">' +
                    '<div class="cap"><b>' + esc(s.student_name) + '</b>' +
                    '<i>' + esc(s.app_title || "") + '</i><i>' + hm(s.created_at) + '</i></div></div>' +
                    '<div class="foot"><button class="btn-d sdel" data-id="' + s.id +
                    '" data-path="' + esc(s.image_path) + '">삭제</button></div></div>';
                }).join("") + '</div>';
            }).join("")
          : '<div class="empty">아직 제출된 결과가 없습니다.</div>') + '</div><div id="modal"></div>';

      app.querySelectorAll(".sdel").forEach(function (b) {
        b.addEventListener("click", function () {
          if (b.textContent === "삭제") { b.textContent = "정말 삭제"; return; }
          b.disabled = true;
          sb.storage.from("submissions").remove([b.dataset.path]).then(function () {
            return sb.from("submissions").delete().eq("id", b.dataset.id);
          }).then(function (r) {
            if (r && r.error) { b.disabled = false; b.textContent = "삭제"; alert("지우지 못했습니다: " + r.error.message); return; }
            panelSubs();
          });
        });
      });

      app.querySelectorAll(".thumb .open").forEach(function (b) {
        b.addEventListener("click", function () {
          $("#modal").innerHTML =
            '<div class="modal"><div class="mbox"><p>' + esc(b.dataset.n) + '</p>' +
            '<img src="' + esc(url(b.dataset.p)) + '" alt="제출 캡처">' +
            '<div style="margin-top:12px"><button class="btn-p" id="close">닫기</button></div></div></div>';
          on("#close", "click", function () { $("#modal").innerHTML = ""; });
        });
      });
    });
}

/* ── 학생 ───────────────────────────────────────────────── */
function studentEnter(code) {
  render('<div class="card"><div class="empty">과제 공간을 찾는 중…</div></div>');
  sb.from("spaces").select("code,title,teacher_name").eq("code", code).maybeSingle().then(function (r) {
    if (!r.data) {
      render('<div class="card"><h2>공간을 찾을 수 없습니다</h2>' +
        '<p class="hint">코드가 맞는지 선생님께 다시 확인해 주세요.</p>' +
        '<button class="btn-p" id="home">처음으로</button></div>');
      on("#home", "click", goHome);
      return;
    }
    ST.space = r.data;
    render(
      '<div class="card"><h2>' + esc(r.data.title) + '</h2>' +
        '<p class="hint">' + esc(r.data.teacher_name || "선생님") + '의 과제 공간입니다. 이름을 입력하면 들어갑니다.</p>' +
        '<label>이름</label><input type="text" id="name" placeholder="예: 3학년 2반 김민서">' +
        '<div class="err" id="err"></div>' +
        '<button class="btn-g" id="go">들어가기</button></div>');
    var go = function () {
      var name = $("#name").value.trim();
      if (!name) return setErr("이름을 입력하세요.");
      $("#go").disabled = true;
      sb.from("visits").insert({ space_code: ST.space.code, student_name: name }).then(function () {
        ST.student = name;
        studentApps();
      });
    };
    on("#go", "click", go);
    on("#name", "keydown", function (e) { if (e.key === "Enter") go(); });
  });
}

function studentApps() {
  render('<div class="card"><div class="empty">과제를 불러오는 중…</div></div>');
  sb.from("apps").select("id,title,folder").eq("space_code", ST.space.code).order("created_at").then(function (r) {
    ST.apps = r.data || [];
    render(
      '<div class="between"><span class="m">' + esc(ST.space.title) + '</span>' +
        '<span class="m">' + esc(ST.student) + '</span></div>' +
      '<div class="card"><h2>과제 목록</h2><p class="hint">과제를 골라 여세요.</p>' +
      (ST.apps.length
        ? (function () {
            var n = 0, gs = groupByFolder(ST.apps);
            var one = gs.length === 1 && gs[0].label === "폴더 없음";
            return gs.map(function (g) {
              return (one ? "" : '<div class="fold">' + esc(g.label) + '<b>' + g.rows.length + '개</b></div>') +
                g.rows.map(function (a) {
                  n++;
                  return '<div class="item"><span class="num">' + String(n).padStart(2, "0") + '</span>' +
                    '<div class="grow"><div class="t">' + esc(a.title) + '</div></div>' +
                    '<button class="btn-p open" data-id="' + a.id + '">열기</button></div>';
                }).join("");
            }).join("");
          })()
        : '<div class="empty">아직 올라온 과제가 없습니다.</div>') + '</div>');
    app.querySelectorAll(".open").forEach(function (b) {
      b.addEventListener("click", function () { studentOpen(b.dataset.id); });
    });
  });
}

function studentOpen(id) {
  sb.from("apps").select("id,title,html").eq("id", id).single().then(function (r) {
    if (!r.data) return;
    var a = r.data;
    render(
      '<div class="between"><button class="btn-s" id="back">← 과제 목록</button>' +
        '<span class="t">' + esc(a.title) + '</span>' +
        '<button class="btn-s" id="full">전체 화면</button></div>' +
      '<div id="holder"></div>' +
      '<div class="card" style="margin-top:14px">' +
        '<button class="btn-g toggle" id="toggle">선생님께 결과 보내기<span id="arrow">▼ 열기</span></button>' +
        '<div id="send" style="display:none;margin-top:16px">' +
          '<p class="hint">완성한 화면을 캡처해서 올리세요. 휴대폰은 화면 캡처, 컴퓨터는 캡처 후 붙여넣기가 편합니다.</p>' +
          '<div class="drop" id="drop">캡처 이미지를 여기에 붙여넣기(Ctrl+V)하거나 끌어다 놓으세요' +
            '<div style="margin-top:12px"><button class="btn-s" id="pick">사진 고르기</button></div></div>' +
          '<input type="file" id="file" accept="image/*" style="display:none">' +
          '<label>한마디 (선택)</label>' +
          '<input type="text" id="note" placeholder="예: 두 번째 문제가 헷갈렸어요">' +
          '<div class="err" id="err"></div><div class="ok" id="ok"></div></div></div>');
    mountFrame("#holder", a.html, a.title);
    on("#back", "click", studentApps);
    on("#full", "click", function () {
      var fr = app.querySelector("#holder iframe");
      if (!fr) return;
      if (fr.requestFullscreen) fr.requestFullscreen();
      else if (fr.webkitRequestFullscreen) fr.webkitRequestFullscreen();
      else fr.scrollIntoView({ block: "start" });
    });
    on("#toggle", "click", function () {
      var box = $("#send"), open = box.style.display === "none";
      box.style.display = open ? "block" : "none";
      $("#arrow").textContent = open ? "▲ 접기" : "▼ 열기";
      if (open) box.scrollIntoView({ behavior: "smooth", block: "nearest" });
    });
    wirePicker(function (file) { sendResult(file, a); });
  });
}

function sendResult(file, appRow) {
  var pick = $("#pick"), ok = $("#ok");
  pick.disabled = true; pick.textContent = "보내는 중…"; setErr(""); ok.textContent = "";
  compress(file).then(function (blob) {
    var path = ST.space.code + "/" + (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(36).slice(2)) + ".jpg";
    return sb.storage.from("submissions").upload(path, blob, { contentType: "image/jpeg" })
      .then(function (up) {
        if (up.error) throw new Error(up.error.message);
        return sb.from("submissions").insert({
          space_code: ST.space.code, app_id: appRow.id, app_title: appRow.title,
          student_name: ST.student, image_path: path, note: $("#note").value.trim() || null
        });
      });
  }).then(function (res) {
    pick.disabled = false; pick.textContent = "사진 고르기";
    if (res && res.error) return setErr("보내지 못했습니다: " + res.error.message);
    ok.textContent = "선생님께 보냈습니다.";
    $("#note").value = "";
  }).catch(function (e) {
    pick.disabled = false; pick.textContent = "사진 고르기";
    setErr(e.message || "보내지 못했습니다. 다시 시도하세요.");
  });
}

boot();
</script>
</body>
</html>
