<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수업용 HTML 과제 앱 공간</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --paper:#F4EDDD; --paper2:#FCFAF3; --ink:#1A1A1A; --ink2:#5B5348;
    --line:#DCCFB4; --blue:#1B4965; --terra:#B7410E; --gold:#A8541E;
    --font: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif;
    --mono: 'SF Mono', Menlo, Consolas, 'Courier New', monospace;
  }
  body { font-family: var(--font); background: var(--paper); color: var(--ink);
    min-height: 100vh; padding: 18px 14px 60px; -webkit-tap-highlight-color: transparent; }
  .wrap { max-width: 880px; margin: 0 auto; }
  .brand { display: flex; align-items: baseline; gap: 10px; margin-bottom: 18px; }
  .brand h1 { font-size: 20px; letter-spacing: -.4px; }
  .brand span { font-size: 11px; color: var(--ink2); font-family: var(--mono); letter-spacing: .5px; }

  .card { background: var(--paper2); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px; margin-bottom: 14px; }
  .card h2 { font-size: 15px; margin-bottom: 4px; }
  .hint { font-size: 12.5px; color: var(--ink2); margin-bottom: 14px; line-height: 1.6; }

  .hero { border: 1px solid var(--line); border-left: 4px solid var(--terra); background: var(--paper2);
    border-radius: 12px; padding: 28px 22px; margin-bottom: 16px; }
  .hero h2 { font-size: 26px; line-height: 1.35; letter-spacing: -.8px; margin-bottom: 10px; }
  .hero p { font-size: 13.5px; color: var(--ink2); line-height: 1.75; margin-bottom: 18px; max-width: 52ch; }
  .steps { display: grid; gap: 8px; }
  .steps div { font-size: 13px; color: var(--ink2); display: flex; gap: 10px; align-items: baseline; }

  label { display: block; font-size: 12px; font-weight: 600; color: var(--ink2); margin-bottom: 5px; }
  select { width: 100%; font-family: var(--font); font-size: 16px; color: var(--ink);
    background: #fff; border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 11px; outline: none; margin-bottom: 12px; }
  select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(27,73,101,.12); }
  .pickbox { background: var(--paper2); border-radius: 12px; padding: 20px; text-align: left; }
  .pickbox h2 { font-size: 15px; margin-bottom: 12px; }
  .ftog { width: 100%; background: none; border: none; border-bottom: 1px solid var(--line);
    border-radius: 0; padding: 15px 2px 7px; display: flex; justify-content: space-between;
    align-items: baseline; font-size: 13px; font-weight: 700; color: var(--blue); }
  .ftog b { font-weight: 400; font-size: 11.5px; color: var(--ink2); font-family: var(--mono); }
  input[type=text], textarea { width: 100%; font-family: var(--font); font-size: 16px; color: var(--ink);
    background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px 11px;
    outline: none; margin-bottom: 12px; }
  textarea { font-family: var(--mono); font-size: 12.5px; line-height: 1.5; min-height: 180px; resize: vertical; }
  input:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(27,73,101,.12); }

  button { font-family: var(--font); cursor: pointer; border-radius: 8px; font-size: 14px;
    font-weight: 600; padding: 10px 16px; border: 1px solid transparent; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .btn-p { background: var(--blue); color: #fff; }
  .btn-s { background: transparent; color: var(--blue); border-color: var(--line); }
  .btn-g { background: var(--terra); color: #fff; }
  .btn-d { background: transparent; color: var(--terra); border-color: var(--line); font-size: 12.5px; padding: 7px 12px; }
  .btn-google { background: #fff; color: var(--ink); border-color: var(--line); display: inline-flex;
    align-items: center; gap: 9px; }
  .btn-google svg { width: 17px; height: 17px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .between { display: flex; justify-content: space-between; align-items: center; gap: 10px;
    flex-wrap: wrap; margin-bottom: 14px; }

  .code-chip { font-family: var(--mono); font-size: 22px; letter-spacing: 4px; font-weight: 700;
    color: var(--blue); background: #fff; border: 1px dashed var(--blue); border-radius: 8px;
    padding: 8px 14px; display: inline-block; }
  .code-sm { font-family: var(--mono); font-size: 13px; letter-spacing: 2px; font-weight: 700;
    color: var(--blue); background: #fff; border: 1px dashed var(--blue); border-radius: 6px; padding: 5px 9px; }
  .linkbox { font-family: var(--mono); font-size: 11.5px; color: var(--ink2); background: #fff;
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 10px; overflow-wrap: anywhere; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; flex-wrap: wrap; }
  .tab { background: none; border: none; padding: 9px 13px; font-size: 13.5px; color: var(--ink2);
    border-bottom: 2px solid transparent; border-radius: 0; }
  .tab.on { color: var(--blue); border-bottom-color: var(--blue); }

  .item { display: flex; align-items: center; gap: 8px; padding: 12px 0;
    border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .item .grow { flex: 1 1 180px; }
  .titlerow { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .item:last-child { border-bottom: none; }
  .grow { flex: 1; min-width: 0; }
  .t { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
  .m { font-size: 11.5px; color: var(--ink2); font-family: var(--mono); margin-top: 2px; }
  .num { font-family: var(--mono); font-size: 11px; color: var(--gold); font-weight: 700; }
  .fold { display: flex; justify-content: space-between; align-items: baseline;
    font-size: 13px; font-weight: 700; color: var(--blue); padding: 15px 0 7px;
    border-bottom: 1px solid var(--line); }
  .fold:first-of-type { padding-top: 2px; }
  .ord { display: inline-flex; gap: 2px; flex: none; }
  .ord .btn-d, .fold .btn-d { padding: 3px 7px; font-size: 11px; line-height: 1.2; }
  .fold .dl { gap: 4px; }
  .fold b { font-weight: 400; font-size: 11.5px; color: var(--ink2); font-family: var(--mono); }
  .dayhead { display: flex; justify-content: space-between; align-items: baseline;
    font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--gold);
    letter-spacing: .3px; padding: 16px 0 7px; border-bottom: 1px solid var(--line); }
  .dayhead:first-of-type { padding-top: 4px; }
  .dayhead b { font-weight: 400; color: var(--ink2); }
  .dayhead .dbtns { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .dl { display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    font-size: inherit; font-weight: inherit; color: inherit; margin: 0; }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--blue); cursor: pointer; flex: none; }
  .thumb .foot { display: flex; justify-content: space-between; align-items: center; }
  .thumb .foot .dl { font-size: 11.5px; color: var(--ink2); font-family: var(--mono); }
  .empty { text-align: center; padding: 28px 12px; color: var(--ink2); font-size: 13px; line-height: 1.7; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .thumb { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff;
    cursor: pointer; padding: 0; display: block; width: 100%; text-align: left; }
  .thumb img { width: 100%; height: 104px; object-fit: cover; display: block; background: #EFE7D6; }
  .thumb .cap { padding: 7px 8px; }
  .thumb .cap b { font-size: 12.5px; display: block; }
  .thumb .cap i { font-size: 10.5px; color: var(--ink2); font-style: normal;
    font-family: var(--mono); display: block; }

  .drop { border: 2px dashed var(--line); border-radius: 10px; background: #fff; padding: 22px 14px;
    text-align: center; font-size: 13px; color: var(--ink2); line-height: 1.7; margin-bottom: 12px; }
  .drop.hot { border-color: var(--blue); background: #F7FAFC; }

  iframe.frame { width: 100%; height: 84vh; min-height: 540px; border: 1px solid var(--line);
    border-radius: 10px; background: #fff; }
  .modal iframe.frame { height: 80vh; }
  .thumb .open { cursor: pointer; }
  .thumb .foot { padding: 0 8px 8px; }
  .toggle { width: 100%; display: flex; justify-content: space-between; align-items: center; }
  .toggle span { font-size: 12px; font-weight: 400; }
  .modal { position: fixed; inset: 0; background: rgba(26,26,26,.78); display: flex;
    align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .mbox { max-width: 760px; width: 100%; text-align: center; }
  .mbox p { color: #fff; font-size: 13px; margin: 10px 0 14px; font-family: var(--mono); overflow-wrap: anywhere; }
  .mbox img { max-width: 100%; max-height: 76vh; border-radius: 8px; background: #fff; }

  /* HTML 제출 (추가) */
  .thumb .face { height: 104px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; background: var(--blue); color: #fff; font-family: var(--mono); font-weight: 700; font-size: 18px; letter-spacing: 2px; }
  .thumb .face small { font-size: 10.5px; font-weight: 400; letter-spacing: 0; opacity: .8; }
  .thumb .face.data { background: var(--gold); }
  .mbox.wide { max-width: 1100px; }
  .mbox.wide .frame { height: 72vh; min-height: 420px; }
  .mbox pre { text-align: left; background: #fff; color: var(--ink); border-radius: 8px; padding: 12px;
    max-height: 30vh; overflow: auto; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; margin-top: 10px; }
  .sendsec { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 6px; }
  .sendsec h3 { font-size: 13.5px; margin-bottom: 6px; color: var(--blue); }
  .err { color: var(--terra); font-size: 12.5px; margin: -4px 0 10px; font-weight: 600; }
  .ok { color: var(--blue); font-size: 12.5px; margin: -4px 0 10px; font-weight: 600; }
  .banner { background: #fff; border: 1px solid var(--line); border-left: 3px solid var(--gold);
    border-radius: 8px; padding: 10px 12px; font-size: 12.5px; color: var(--ink2);
    line-height: 1.6; margin-bottom: 14px; }
  .banner code { font-family: var(--mono); font-size: 11.5px; color: var(--terra); }

  .kit { background:#FFF8E6; border:2px solid #2C2C2A; border-radius:14px;
    padding:26px 22px 24px; margin-bottom:16px; box-shadow:5px 5px 0 #E8D9B0; }
  .kit .tag { display:inline-block; background:#F4C0D1; border:2px solid #2C2C2A;
    border-radius:20px; padding:3px 13px; font-size:12px; font-weight:700; color:#4B1528;
    transform:rotate(-3deg); margin-bottom:14px; }
  .kit h2 { font-size:27px; line-height:1.35; letter-spacing:-.8px; margin-bottom:12px; color:#2C2C2A; }
  .kit h2 em { font-style:normal; background:#FAC775; padding:0 7px; border-radius:3px;
    box-decoration-break:clone; -webkit-box-decoration-break:clone; }
  .kit p.lead { font-size:13.5px; color:#5F5E5A; line-height:1.75; margin-bottom:18px; max-width:46ch; }
  .kit .btn-google { background:#2C2C2A; color:#FFF8E6; border:2px solid #2C2C2A;
    box-shadow:4px 4px 0 #D85A30; font-weight:700; }
  .kit .btn-google:active { transform:translate(2px,2px); box-shadow:2px 2px 0 #D85A30; }
  .flow { width:100%; max-width:675px; height:auto; display:block; margin:6px 0 22px; }
  .kitcard { background:#FFF8E6; border:2px solid #2C2C2A; border-radius:14px;
    padding:20px 20px 22px; margin-bottom:16px; box-shadow:5px 5px 0 #CDE8DC; }
  .kitcard h2 { font-size:17px; color:#2C2C2A; margin-bottom:4px; }
  .kitcard .hint { color:#5F5E5A; }
  .kitcard input[type=text] { border:2px solid #2C2C2A; border-radius:10px; background:#fff;
    font-family:var(--mono); letter-spacing:2px; }
  .kitcard .btn-g { background:#5DCAA5; color:#04342C; border:2px solid #2C2C2A;
    box-shadow:4px 4px 0 #2C2C2A; font-weight:700; }
  .kitcard .btn-g:active { transform:translate(2px,2px); box-shadow:2px 2px 0 #2C2C2A; }
  .kitgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:16px; }
  .kitgrid .who { display:inline-block; font-size:12px; font-weight:700; border:2px solid #2C2C2A;
    border-radius:20px; padding:2px 12px; margin-bottom:12px; }
  .kitgrid .who.t { background:#FAC775; color:#412402; transform:rotate(-2deg); }
  .kitgrid .who.s { background:#9FE1CB; color:#04342C; transform:rotate(2deg); }
  .tip { background:#FFF8E6; border:2px dashed #2C2C2A; border-radius:12px; padding:13px 16px;
    font-size:12.5px; color:#444441; line-height:1.7; margin-bottom:16px; }
  .tip a { color:#B7410E; font-weight:700; text-decoration:none; border-bottom:2px solid #FAC775; }
  .kitsteps { display:grid; gap:9px; }
  .kitsteps div { font-size:13px; color:#444441; display:flex; gap:10px; align-items:baseline; }
  .kitsteps .num { background:#9FE1CB; border:1.5px solid #2C2C2A; border-radius:6px;
    color:#04342C; padding:1px 6px; font-size:11px; }
  @media (max-width:520px) { .kit h2 { font-size:22px; } }

  .card { background:#FFF8E6; border:2px solid #2C2C2A; border-radius:12px;
    box-shadow:4px 4px 0 #E8D9B0; }
  .card h2 { color:#2C2C2A; }
  .tabs { border-bottom:none; gap:7px; margin-bottom:14px; }
  .tab { border:2px solid #DCCFB4; border-radius:20px; padding:5px 14px; font-size:12.5px;
    color:#5F5E5A; background:transparent; }
  .tab.on { background:#9FE1CB; border-color:#2C2C2A; color:#04342C; border-bottom-color:#2C2C2A; }
  .code-chip { background:#FAC775; border:2px solid #2C2C2A; color:#412402; }
  .code-sm { background:#FAC775; border:2px solid #2C2C2A; color:#412402; }
  .num { background:#FAC775; border:1.5px solid #2C2C2A; border-radius:5px;
    padding:1px 6px; color:#412402; }
  .fold { color:#2C2C2A; border-bottom:2px solid #DCCFB4; }
  .dayhead { color:#412402; border-bottom:2px solid #DCCFB4; }
  .btn-p { background:#1B4965; color:#fff; border:2px solid #2C2C2A; box-shadow:3px 3px 0 #2C2C2A; }
  .btn-g { background:#9FE1CB; color:#04342C; border:2px solid #2C2C2A; box-shadow:3px 3px 0 #2C2C2A; }
  .btn-s { background:#fff; color:#2C2C2A; border:2px solid #2C2C2A; box-shadow:2px 2px 0 #E8D9B0; }
  .btn-d { background:#fff; color:#993C1D; border:1.5px solid #2C2C2A; box-shadow:none; }
  .btn-p:active, .btn-g:active { transform:translate(2px,2px); box-shadow:1px 1px 0 #2C2C2A; }
  .btn-s:active { transform:translate(1px,1px); box-shadow:1px 1px 0 #E8D9B0; }
  .ord .btn-d, .fold .btn-d { box-shadow:none; }
  input[type=text], input[type=password], select { border:2px solid #2C2C2A; border-radius:10px; }
  textarea { border:1.5px solid #2C2C2A; border-radius:10px; }
  .item { border-bottom:1px solid #E3D6B8; }
  .thumb { border:1px solid #DCCFB4; box-shadow:none; }
  .thumb .btn-d { border-width:1px; }
  iframe.frame { border:1px solid #DCCFB4; }
  .linkbox { border:1.5px solid #DCCFB4; }
  .empty { color:#5F5E5A; }

  .titlebtn { background:none; border:none; padding:0; font-size:14px; font-weight:600;
    color:#2C2C2A; border-bottom:1.5px dotted #888780; border-radius:0; text-align:left;
    font-family:var(--font); }
  .titlebtn:hover { border-bottom-color:#1B4965; color:#1B4965; }
  .iconbtn { background:#fff; border:1px solid #DCCFB4; border-radius:6px; padding:2px 5px;
    margin-left:5px; color:#5F5E5A; line-height:0; box-shadow:none; vertical-align:2px; }
  .iconbtn:hover { border-color:#2C2C2A; color:#2C2C2A; }
  .iconbtn.danger { color:#993C1D; }
  .iconbtn.armed { background:#FCEBEB; border-color:#A32D2D; color:#A32D2D; }
  .mini { background:#fff; border:1.5px solid #2C2C2A; border-radius:4px; color:#993C1D;
    font-size:10px; line-height:1; padding:2px 5px; box-shadow:none; }
  .ord { display:inline-flex; flex-direction:column; gap:2px; flex:none; }
  .fold .mini { margin-right:2px; }
  .menuwrap { position:relative; display:inline-block; flex:none; }
  .dots { padding:2px 10px; font-size:16px; line-height:1.4; }
  .menu { position:absolute; right:0; top:calc(100% + 6px); z-index:20; width:190px;
    background:#fff; border:2px solid #2C2C2A; border-radius:10px;
    box-shadow:4px 4px 0 #E8D9B0; overflow:hidden; }
  .menu[hidden] { display:none; }
  .mi { display:flex; align-items:center; gap:8px; width:100%; background:#fff; border:none;
    border-bottom:1px solid #E3D6B8; border-radius:0; padding:10px 12px; font-size:12.5px;
    font-weight:500; color:#2C2C2A; text-align:left; box-shadow:none; }
  .mi:last-child { border-bottom:none; }
  .mi:hover { background:#FFF8E6; }
  .mi svg { flex:none; color:#5F5E5A; }
  .item .t { display:flex; align-items:center; flex-wrap:wrap; }

  .filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .filters select { width:auto; min-width:150px; margin-bottom:0; font-size:13px; padding:7px 10px; }
  .mwrap { overflow-x:auto; margin:0 -4px; padding:0 4px 4px; }
  table.matrix { border-collapse:collapse; font-size:12.5px; }
  table.matrix th, table.matrix td { border:1px solid #DCCFB4; padding:6px 9px; text-align:center;
    white-space:nowrap; }
  table.matrix thead th { background:#FAC775; color:#412402; font-weight:700; font-size:11.5px;
    border-color:#2C2C2A; }
  table.matrix th.nm { text-align:left; background:#FCFAF3; color:#2C2C2A; font-weight:600;
    position:sticky; left:0; }
  table.matrix td.yes { background:#E1F5EE; color:#0F6E56; font-weight:700; }
  table.matrix td.no { color:#B4B2A9; }
  table.matrix td.sum { font-family:var(--mono); font-size:11.5px; color:#5B5348; background:#FCFAF3; }
  .note { font-size:12px; color:#5B5348; background:#FFF8E6; border-left:3px solid #FAC775;
    padding:4px 9px; margin-top:4px; border-radius:0 6px 6px 0; line-height:1.6; }
  .foot { margin-top:32px; padding-top:16px; border-top:2px dashed #DCCFB4;
    text-align:center; font-size:11.5px; color:#5F5E5A; line-height:1.9; }
  .foot a { color:#993C1D; text-decoration:none; border-bottom:1px solid #DCCFB4; }
  .foot a:hover { border-bottom-color:#993C1D; }

  .modetag { display:inline-block; font-size:10.5px; font-weight:700; color:#fff;
    border-radius:20px; padding:2px 10px; margin-left:7px; vertical-align:2px; white-space:nowrap; }
  .modetag.cls { background:#1B4965; }
  .modetag.open { background:#B7410E; }
  .item.m-class, .item.m-open { padding-left:12px; background:#FCFAF3; }
  .item.m-class { border-left:6px solid #1B4965; }
  .item.m-open { border-left:6px solid #B7410E; }
  .card.m-class { border-left:6px solid #1B4965; border-radius:0 12px 12px 0; }
  .card.m-open { border-left:6px solid #B7410E; border-radius:0 12px 12px 0; }
  .card .modetag { margin-left:0; display:inline-block; }
  .filters .btn-s.on { background:#9FE1CB; color:#04342C; }

  .libgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(165px,1fr));
    gap:12px; margin:12px 0 4px; }
  .libcard { position:relative; background:#fff; border:2px solid #2C2C2A; border-radius:10px;
    overflow:visible; box-shadow:3px 3px 0 #E8D9B0; }
  .libthumb { position:relative; height:112px; border-bottom:2px solid #2C2C2A; overflow:hidden;
    background:#FCFAF3; border-radius:8px 8px 0 0; cursor:pointer;
    display:flex; align-items:center; justify-content:center; }
  .libthumb .tph { font-size:30px; font-weight:700; color:#DCCFB4; }
  .libthumb .tframe { position:absolute; top:0; left:0; width:660px; height:450px; border:0;
    transform:scale(.33); transform-origin:0 0; pointer-events:none; background:#fff; }
  .libcap { padding:8px 9px 9px; }
  .libcap b { display:block; font-size:12.5px; font-weight:600; color:#2C2C2A; line-height:1.4;
    cursor:pointer; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .libcap i { display:block; font-style:normal; font-family:var(--mono); font-size:10.5px;
    color:#5B5348; margin-top:3px; }
  .libmenu { position:absolute; top:6px; right:6px; z-index:5; }
  .libmenu .dots { padding:0 7px; font-size:14px; line-height:1.5; background:#fff;
    box-shadow:2px 2px 0 #E8D9B0; }
  .libcard .menu { right:0; width:180px; }

function esc(s) {

function fmt(iso) {

function saveOrder(groups, done) {
  var flat = [], jobs = [];
  groups.forEach(function (g) { g.rows.forEach(function (a) { flat.push(a); }); });
  flat.forEach(function (a, i) {
    if (a.position !== i) {
      a.position = i;
      jobs.push(sb.from("apps").update({ position: i }).eq("id", a.id));
    }
  });
  if (!jobs.length) return done();
  Promise.all(jobs).then(function (rs) {
    var bad = rs.filter(function (r) { return r && r.error; })[0];
    if (bad) alert("순서를 저장하지 못했습니다: " + bad.error.message);
    done();
  });
}

function swap(arr, i, j) {

/* 캡처 이미지 줄이기 → JPEG Blob */
function compress(file) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var max = 1400, scale = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      var ctx = c.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function (b) { b ? resolve(b) : reject(new Error("이미지를 만들지 못했습니다")); }, "image/jpeg", 0.82);
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("이미지를 읽을 수 없습니다")); };
    img.src = url;
  });
}

function mountFrame(holderSel, html, title) {

  f.className = "frame";

}

function wirePicker(onPick) {
  var drop = $("#drop"), input = $("#file"), btn = $("#pick");
  if (!drop) return;
  var take = function (f) { if (f && f.type.indexOf("image/") === 0) onPick(f); };
  drop.addEventListener("dragover", function (e) { e.preventDefault(); drop.classList.add("hot"); });
  drop.addEventListener("dragleave", function () { drop.classList.remove("hot"); });
  drop.addEventListener("drop", function (e) {
    e.preventDefault(); drop.classList.remove("hot"); take(e.dataTransfer.files[0]);
  });
  document.addEventListener("paste", function (e) {
    if (!document.body.contains(drop) || !drop.offsetParent) return;
    var items = e.clipboardData ? e.clipboardData.items : [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].type.indexOf("image/") === 0) { take(items[i].getAsFile()); break; }
    }
  });
  btn.addEventListener("click", function () { input.click(); });
  input.addEventListener("change", function () { take(input.files[0]); input.value = ""; });
}

function duplicateSpace(code, title, btn) {
  var next = window.prompt("새 공간의 이름을 적으세요. 과제는 그대로 복사되고 학생 기록은 복사되지 않습니다.",
    title + " (복사본)");
  if (next === null) return;
  next = next.trim();
  if (!next) return alert("이름은 비워 둘 수 없습니다.");
  btn.disabled = true; btn.textContent = "복제 중…";

  var done = function (msg) {
    btn.disabled = false; btn.textContent = "복제";
    if (msg) alert(msg); else viewSpaces();
  };

  var attempt = function (n) {
    var newCode = mkCode();
    var src = (ST.spaces || []).filter(function (x) { return x.code === code; })[0] || {};
    sb.from("spaces").insert({
      code: newCode, owner: ST.user.id, title: next, mode: src.mode || "class",
      folder: src.folder || null,
      teacher_name: ST.user.user_metadata && ST.user.user_metadata.full_name || ""
    }).then(function (r) {
      if (r.error) {
        if (r.error.code === "23505" && n < 5) return attempt(n + 1);
        return done("새 공간을 만들지 못했습니다: " + r.error.message);
      }
      sb.from("apps").select("title,html,folder,position").eq("space_code", code)
        .order("position", { ascending: true, nullsFirst: false }).then(function (rr) {
          var list = (rr.data || []).map(function (a, i) {
            return { space_code: newCode, title: a.title, html: a.html, folder: a.folder || null, position: i };
          });
          if (!list.length) return done();
          sb.from("apps").insert(list).then(function (r3) {
            if (r3.error) return done("공간은 만들었지만 과제를 옮기지 못했습니다: " + r3.error.message);
            done();
          });
        });
    });
  };
  attempt(0);
}

function createSpace() {
  var title = $("#title").value.trim();
  if (!title) return setErr("공간 이름을 입력하세요.");
  var btn = $("#make");
  btn.disabled = true; setErr("");
  var name = ST.user.user_metadata && ST.user.user_metadata.full_name || "";

  var attempt = function (n) {
    var code = mkCode();
    sb.from("spaces").insert({ code: code, owner: ST.user.id, title: title, teacher_name: name,
      mode: ($("#smode") && $("#smode").value) || "class" })
      .then(function (r) {
        if (r.error) {
          if (r.error.code === "23505" && n < 5) return attempt(n + 1);
          btn.disabled = false;
          return setErr("공간을 만들지 못했습니다: " + r.error.message);
        }
        viewSpaces();
      });
  };
  attempt(0);
}

/* 보관함 카드에 작은 미리보기 채우기 (보이는 것부터 하나씩) */
function lazyThumbs() {
  var boxes = Array.prototype.slice.call(app.querySelectorAll(".libthumb[data-lazy]"));
  if (!boxes.length) return;
  var fill = function (box) {
    var id = box.dataset.lazy;
    if (!id) return;
    delete box.dataset.lazy;
    sb.from("apps").select("html").eq("id", id).single().then(function (r) {
      if (!r.data || !r.data.html) return;
      var f = document.createElement("iframe");
      f.setAttribute("sandbox", "allow-scripts");
      f.setAttribute("scrolling", "no");
      f.className = "tframe";
      f.srcdoc = r.data.html;
      box.innerHTML = "";
      box.appendChild(f);
    }).catch(function () { });
  };
  if (!window.IntersectionObserver) { boxes.slice(0, 12).forEach(fill); return; }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) { fill(e.target); io.unobserve(e.target); }
    });
  }, { rootMargin: "200px" });
  boxes.forEach(function (b) { io.observe(b); });
}

/* QR 만들기 (처음 한 번만 도구를 받아 옵니다) */
function loadQR() {
  if (window.qrcode) return Promise.resolve(window.qrcode);
  return new Promise(function (res, rej) {
    var sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js";
    sc.onload = function () { res(window.qrcode); };
    sc.onerror = function () { rej(new Error("QR 도구를 불러오지 못했습니다.")); };
    document.head.appendChild(sc);
  });
}

function makeQR(text) {
  var q = window.qrcode(0, "M");
  q.addData(text);
  q.make();
  return q;
}

function drawQR(sel, text, cell) {
  var box = $(sel);
  if (!box) return;
  loadQR().then(function () {
    box.innerHTML = makeQR(text).createSvgTag({ cellSize: cell || 4, margin: 2, scalable: true });
    var svg = box.querySelector("svg");
    if (svg) { svg.removeAttribute("width"); svg.removeAttribute("height"); svg.style.width = "100%"; svg.style.height = "100%"; }
  }).catch(function () {
    box.innerHTML = '<span class="m" style="padding:8px;text-align:center">QR 을 만들지 못했습니다</span>';
  });
}

/* QR 크게 보기 · 이미지로 받기 */
function bigQR(sp) {
  var link = shareLink(sp.code);
  var box = $("#qrmodal");
  if (!box) { box = document.createElement("div"); box.id = "qrmodal"; app.appendChild(box); }
  box.innerHTML =
    '<div class="modal"><div class="mbox"><div class="pickbox" style="text-align:center">' +
    '<h2 style="text-align:center">' + esc(sp.title) + '</h2>' +
    '<div class="qrbig" id="qrbig"></div>' +
    '<p style="font-family:var(--mono);font-size:22px;letter-spacing:5px;color:#1B4965;margin:12px 0 4px">' + esc(sp.code) + '</p>' +
    '<p class="hint" style="text-align:center;overflow-wrap:anywhere">' + esc(link) + '</p>' +
    '<div class="row" style="justify-content:center">' +
    '<button class="btn-p" id="qrdl">이미지로 받기</button>' +
    '<button class="btn-s" id="qrprint">인쇄</button>' +
    '<button class="btn-s" id="qrclose">닫기</button></div></div></div></div>';
  drawQR("#qrbig", link, 8);
  on("#qrclose", "click", function () { box.innerHTML = ""; });
  on("#qrprint", "click", function () { window.print(); });
  on("#qrdl", "click", function () {
    loadQR().then(function () {
      var q = makeQR(link), n = q.getModuleCount(), m = 4, px = 12;
      var c = document.createElement("canvas");
      c.width = c.height = (n + m * 2) * px;
      var g = c.getContext("2d");
      g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
      g.fillStyle = "#1A1A1A";
      for (var r = 0; r < n; r++) for (var k = 0; k < n; k++) {
        if (q.isDark(r, k)) g.fillRect((k + m) * px, (r + m) * px, px, px);
      }
      g.fillStyle = "#1A1A1A";
      g.font = "bold " + (px * 2.2) + "px monospace";
      g.textAlign = "center";
      g.fillText(sp.code, c.width / 2, c.height - px * 1.2);
      var a = document.createElement("a");
      a.href = c.toDataURL("image/png");
      a.download = (sp.title || "space").replace(/[\\/:*?"<>|]/g, "") + "_QR.png";
      a.click();
    });
  });
}

      '<div class="linkbox">' + esc(shareLink(sp.code)) + '</div>' +
      '<p class="hint" style="margin:10px 0 0">링크가 길면 ' +
      '<a href="https://숏.한국" target="_blank" rel="noopener" style="color:var(--terra);font-weight:600">숏.한국</a>' +
      '에서 줄여 보내시면 칠판에 적기 좋습니다.</p></div>' +
    '<div class="tabs">' +
      '<button class="tab' + (ST.tab === "apps" ? " on" : "") + '" data-tab="apps">과제 앱</button>' +
      (sp.mode === "open" ? '' :
        '<button class="tab' + (ST.tab === "log" ? " on" : "") + '" data-tab="log">접속 기록</button>' +
        '<button class="tab' + (ST.tab === "sub" ? " on" : "") + '" data-tab="sub">제출 결과</button>' +
        '<button class="tab' + (ST.tab === "stu" ? " on" : "") + '" data-tab="stu">학생 명단</button>') +
      (sp.owner === ST.user.id
        ? '<button class="tab' + (ST.tab === "mem" ? " on" : "") + '" data-tab="mem">함께 관리</button>'
        : '') +
    '</div><div id="panel"><div class="card"><div class="empty">불러오는 중…</div></div></div>');

  on("#back", "click", viewSpaces);
  on("#cpCode", "click", function (e) { copy(sp.code, e.target); });
  on("#cpLink", "click", function (e) { copy(shareLink(sp.code), e.target); });
  on("#openLink", "click", function () { window.open(shareLink(sp.code), "_blank"); });
  drawQR("#qrbox", shareLink(sp.code), 3);
  on("#qrbox", "click", function () { bigQR(sp); });
  on("#renSpace", "click", function () {
    var next = window.prompt("과제 공간 이름을 바꿉니다.", sp.title);
    if (next === null) return;
    next = next.trim();
    if (!next) return alert("이름은 비워 둘 수 없습니다.");
    sb.from("spaces").update({ title: next }).eq("code", sp.code).then(function (r) {
      if (r.error) return alert("바꾸지 못했습니다: " + r.error.message);
      sp.title = next;
      ST.spaces.forEach(function (x) { if (x.code === sp.code) x.title = next; });
      viewDash();
    });
  });
  app.querySelectorAll(".tab").forEach(function (b) {
    b.addEventListener("click", function () { ST.tab = b.dataset.tab; viewDash(); });
  });

  if (sp.mode === "open" && ST.tab !== "apps" && ST.tab !== "mem") ST.tab = "apps";
  if (ST.tab === "apps") panelApps();
  else if (ST.tab === "log") panelLog();
  else if (ST.tab === "mem") panelMembers();
  else if (ST.tab === "stu") panelStudents();
  else panelSubs();
}

/* 폴더 선택 상자 만들기 */
function folderSelect(id, current, folders) {
  var opts = '<option value=""' + (current ? "" : " selected") + '>폴더 없음</option>';
  folders.forEach(function (f) {
    opts += '<option value="' + esc(f) + '"' + (f === current ? " selected" : "") + '>' + esc(f) + '</option>';
  });
  opts += '<option value="__new">+ 새 폴더 만들기…</option>';
  return '<select id="' + id + '">' + opts + '</select>';
}

/* 선택 상자 + 새 폴더 칸에서 최종 폴더 이름 읽기 (미입력이면 null) */
function readFolder(selId, inputId) {
  var v = $("#" + selId).value;
  if (v !== "__new") return v;
  var t = $("#" + inputId).value.trim();
  return t || null;
}

/* '새 폴더 만들기'를 고르면 입력칸이 나타나도록 */
function wireFolderSelect(selId, inputId) {
  var sel = $("#" + selId), box = $("#" + inputId);
  if (!sel || !box) return;
  sel.addEventListener("change", function () {
    box.style.display = sel.value === "__new" ? "block" : "none";
    if (sel.value === "__new") box.focus();
  });
}

/* ⋯ 메뉴 열고 닫기 */
function wireMenus() {
  var closeAll = function () { app.querySelectorAll(".menu").forEach(function (m) { m.hidden = true; }); };
  app.querySelectorAll(".dots").forEach(function (b) {
    b.addEventListener("click", function (e) {
      e.stopPropagation();
      var box = $("#m" + b.dataset.m), was = box.hidden;
      closeAll();
      box.hidden = !was;
    });
  });
  app.querySelectorAll(".mi").forEach(function (b) { b.addEventListener("click", closeAll); });
  if (!window.__menuClose) {
    window.__menuClose = true;
    document.addEventListener("click", function () {
      app.querySelectorAll(".menu").forEach(function (m) { m.hidden = true; });
    });
  }
}

                      '<button class="mi code" data-id="' + a.id + '">' + ICON.code + 'HTML 코드 보기</button>' +

          '<p class="hint">HTML 파일 하나로 된 활동을 그대로 올립니다. 코드를 붙여넣거나 .html 파일을 고르세요.</p>' +

          '<input type="text" id="anote" placeholder="예: 모둠별로 해 보고 결과를 캡처해 보내세요">' +

          '<input type="text" id="anewf" placeholder="새 폴더 이름" style="display:none">' +

          app.querySelectorAll(".ord .mini, .fup, .fdn").forEach(function (x) { x.disabled = true; });
          if (!fn(Number(b.dataset.g), Number(b.dataset.a))) {
            app.querySelectorAll(".ord .mini, .fup, .fdn").forEach(function (x) { x.disabled = false; });
            return;
          }
          saveOrder(GROUPS, panelApps);
        };
      };
      app.querySelectorAll(".aup").forEach(function (b) {
        b.addEventListener("click", reorder(function (g, a) { return swap(GROUPS[g].rows, a, a - 1); }));
      });
      app.querySelectorAll(".adn").forEach(function (b) {
        b.addEventListener("click", reorder(function (g, a) { return swap(GROUPS[g].rows, a, a + 1); }));
      });
      app.querySelectorAll(".fup").forEach(function (b) {
        b.addEventListener("click", reorder(function (g) { return swap(GROUPS, g, g - 1); }));
      });
      app.querySelectorAll(".fdn").forEach(function (b) {
        b.addEventListener("click", reorder(function (g) { return swap(GROUPS, g, g + 1); }));
      });

      app.querySelectorAll(".ren").forEach(function (b) {
        b.addEventListener("click", function () {
          var next = window.prompt("과제 제목을 바꿉니다.", b.dataset.t);
          if (next === null) return;
          next = next.trim();
          if (!next) return alert("제목은 비워 둘 수 없습니다.");
          sb.from("apps").update({ title: next }).eq("id", b.dataset.id).then(function (r) {
            if (r.error) return alert("바꾸지 못했습니다: " + r.error.message);
            panelApps();
          });
        });
      });

      app.querySelectorAll(".move").forEach(function (b) {
        b.addEventListener("click", function () {
          var cur = b.dataset.f || "";
          $("#modal").innerHTML =
            '<div class="modal"><div class="mbox"><div class="pickbox">' +
            '<h2>폴더 옮기기</h2>' +
            '<label>옮길 폴더를 고르세요</label>' + folderSelect("mfolder", cur, folders) +
            '<input type="text" id="mnewf" placeholder="새 폴더 이름" style="display:none">' +
            '<div class="row"><button class="btn-p" id="mok">옮기기</button>' +
            '<button class="btn-s" id="mcancel">취소</button></div></div></div></div>';
          wireFolderSelect("mfolder", "mnewf");
          on("#mcancel", "click", function () { $("#modal").innerHTML = ""; });
          on("#mok", "click", function () {

              if (r.error) return alert("옮기지 못했습니다: " + r.error.message);
              panelApps();
            });
          });

      app.querySelectorAll(".anote").forEach(function (b) {
        b.addEventListener("click", function () {
          var next = window.prompt("학생에게 함께 보일 안내문입니다. 비우면 지워집니다.", b.dataset.n || "");

          sb.from("apps").update({ note: next.trim() || null }).eq("id", b.dataset.id).then(function (r) {

/* 과제의 HTML 코드 보기 */
function showCode(id) {
  sb.from("apps").select("title,html").eq("id", id).single().then(function (r) {
    if (!r.data) return;
    $("#modal").innerHTML =
      '<div class="modal"><div class="mbox"><div class="pickbox">' +
      '<h2>' + esc(r.data.title) + '</h2>' +
      '<p class="hint">이 과제의 HTML 코드입니다. 그대로 복사해 고치거나 다른 곳에 쓸 수 있습니다.</p>' +
      '<textarea id="codebox" readonly style="min-height:300px"></textarea>' +
      '<div class="row"><button class="btn-p" id="cpcode">코드 복사</button>' +
      '<button class="btn-s" id="dlcode">파일로 받기</button>' +
      '<button class="btn-s" id="ccancel">닫기</button></div></div></div></div>';
    $("#codebox").value = r.data.html;
    on("#cpcode", "click", function (e) { copy(r.data.html, e.target); });
    on("#dlcode", "click", function () {
      var blob = new Blob([r.data.html], { type: "text/html" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = (r.data.title || "과제").replace(/[\\/:*?"<>|]/g, "") + ".html";
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    });
    on("#ccancel", "click", function () { $("#modal").innerHTML = ""; });
  });
}

/* 다른 과제 공간으로 복사 */
function copyToSpace(id, title) {
  var cur = ST.space ? ST.space.code : "";
  var others = (ST.spaces || []).filter(function (x) { return x.code !== cur; });
  if (!others.length) {
    alert("복사해 넣을 다른 공간이 없습니다. 먼저 공간을 하나 더 만들어 주세요.");
    return;
  }
  $("#modal").innerHTML =
    '<div class="modal"><div class="mbox"><div class="pickbox">' +
    '<h2>다른 공간으로 복사</h2>' +
    '<p class="hint">' + esc(title) + ' 을(를) 복사합니다. 원본은 이 공간에 그대로 남습니다.</p>' +
    '<label>어느 공간으로 보낼까요</label>' +
    '<select id="tospace">' + others.map(function (x) {
      return '<option value="' + esc(x.code) + '">' + esc(x.title) + ' · ' + esc(x.code) + '</option>';
    }).join("") + '</select>' +
    '<div class="err" id="err"></div>' +
    '<div class="row"><button class="btn-p" id="docopy">복사하기</button>' +
    '<button class="btn-s" id="pcancel">취소</button></div></div></div></div>';
  on("#pcancel", "click", function () { $("#modal").innerHTML = ""; });
  on("#docopy", "click", function () {
    var to = $("#tospace").value, btn = $("#docopy");
    btn.disabled = true; btn.textContent = "복사하는 중…";
    sb.from("apps").select("title,html,folder").eq("id", id).single().then(function (r) {
      if (!r.data) throw new Error("원본을 읽지 못했습니다.");
      return sb.from("apps").insert({
        space_code: to, title: r.data.title, html: r.data.html, folder: r.data.folder || null
      });
    }).then(function (rr) {
      btn.disabled = false; btn.textContent = "복사하기";
      if (rr && rr.error) return setErr("복사하지 못했습니다: " + rr.error.message);
      $("#modal").innerHTML = "";
      var nm = others.filter(function (x) { return x.code === to; })[0];
      alert((nm ? nm.title : to) + " 으로 복사했습니다.");
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = "복사하기";
      setErr(e.message || "복사하지 못했습니다.");
    });
  });
}

function previewApp(id) {
  sb.from("apps").select("title,html").eq("id", id).single().then(function (r) {
    if (!r.data) return;
    $("#modal").innerHTML =
      '<div class="modal"><div class="mbox"><p>' + esc(r.data.title) + '</p>' +

}

                '<button class="btn-d dsel">선택 삭제</button>' +
                '<button class="btn-d dall">전체 삭제</button></span></div>' +

                  return '<div class="item"><input type="checkbox" class="chk" data-id="' + v.id + '">' +

                    '<button class="btn-d vdel" data-id="' + v.id + '">삭제</button></div>';
                }).join("") + '</div>';
            }).join("")
          : '<div class="empty">아직 들어온 학생이 없습니다.</div>') + '</div>';

      wireGroups(function (ids) {
        return sb.from("visits").delete().in("id", ids);
      }, panelLog);

          sb.from("visits").delete().eq("id", b.dataset.id).then(function (r) {
            if (r.error) { b.disabled = false; b.textContent = "삭제"; alert("지우지 못했습니다: " + r.error.message); return; }
            panelLog();
          });
        });
      });
    });
}

/* 날짜 묶음의 전체 선택 · 선택 삭제 · 전체 삭제 */
function wireGroups(deleteFn, reload) {
  app.querySelectorAll(".daygroup").forEach(function (grp) {
    var boxes = grp.querySelectorAll(".chk");
    var head = grp.querySelector(".dchk");

    head.addEventListener("change", function () {
      boxes.forEach(function (c) { c.checked = head.checked; });
    });
    boxes.forEach(function (c) {
      c.addEventListener("change", function () {
        var all = Array.prototype.every.call(boxes, function (x) { return x.checked; });
        head.checked = all;
      });
    });

    var run = function (btn, list, label) {
      if (!list.length) { alert("고른 항목이 없습니다."); return; }
      if (btn.dataset.armed !== "1") {
        btn.dataset.armed = "1";
        btn.textContent = list.length + "건 정말 삭제";
        setTimeout(function () {
          if (btn.dataset.armed === "1") { btn.dataset.armed = ""; btn.textContent = label; }
        }, 4000);
        return;
      }
      btn.disabled = true;
      btn.textContent = "지우는 중…";
      var ids = list.map(function (c) { return c.dataset.id; });
      var paths = list.map(function (c) { return c.dataset.path; }).filter(Boolean);
      var step = paths.length
        ? sb.storage.from("submissions").remove(paths).then(function () { return deleteFn(ids); })
        : deleteFn(ids);
      step.then(function (r) {
        if (r && r.error) {
          btn.disabled = false; btn.dataset.armed = ""; btn.textContent = label;
          alert("지우지 못했습니다: " + r.error.message);
          return;
        }
        reload();
      });
    };

    grp.querySelector(".dsel").addEventListener("click", function (e) {
      run(e.target, Array.prototype.filter.call(boxes, function (c) { return c.checked; }), "선택 삭제");
    });
    grp.querySelector(".dall").addEventListener("click", function (e) {
      run(e.target, Array.prototype.slice.call(boxes), "전체 삭제");
    });
  });
}

/* 하루치 제출물을 zip 으로 묶어 내려받기 */
function loadJSZip() {
  if (window.JSZip) return Promise.resolve(window.JSZip);
  return new Promise(function (res, rej) {
    var sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js";
    sc.onload = function () { res(window.JSZip); };
    sc.onerror = function () { rej(new Error("압축 도구를 불러오지 못했습니다.")); };
    document.head.appendChild(sc);
  });
}

function downloadDay(label, rows, btn) {
  if (!rows.length) return alert("내려받을 것이 없습니다.");
  var old = btn.textContent;
  btn.disabled = true; btn.textContent = "준비 중…";
  var safe = function (t) { return String(t || "").replace(/[\\/:*?"<>|]/g, "").slice(0, 40); };
  var csv = "\uFEFF이름,과제,시각,한마디,파일\n";

  loadJSZip().then(function (JSZip) {
    var zip = new JSZip(), jobs = [], used = {};
    rows.forEach(function (r, i) {
      var base = safe(r.student_name) + "_" + safe(r.app_title || "과제");
      var nm = base; var k = 2;
      while (used[nm]) { nm = base + "(" + (k++) + ")"; }
      used[nm] = true;
      csv += '"' + (r.student_name || "") + '","' + (r.app_title || "") + '","' + fmt(r.created_at) +
             '","' + (r.note || "").replace(/"/g, "'") + '","' + nm + '"\n';
      if (r.image_path) {
        var url = sb.storage.from("submissions").getPublicUrl(r.image_path).data.publicUrl;
        var ext = (r.file_name && (r.file_name.match(/\.[A-Za-z0-9]+$/) || [])[0]) || ".jpg";
        jobs.push(fetch(url).then(function (res) { return res.blob(); })
          .then(function (b) { zip.file(nm + ext, b); })
          .catch(function () { }));
      } else {
        jobs.push(sb.from("submissions").select("html,payload").eq("id", r.id).single()
          .then(function (rr) {
            if (!rr.data) return;
            if (rr.data.html) zip.file(nm + ".html", rr.data.html);
            else if (rr.data.payload) zip.file(nm + ".json", JSON.stringify(rr.data.payload, null, 2));
          }).catch(function () { }));
      }
    });

    return Promise.all(jobs).then(function () {
      zip.file("목록.csv", csv);
      return zip.generateAsync({ type: "blob" });
    }).then(function (blob) {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = safe(ST.space.title) + "_" + label.replace(/[^0-9]/g, "") + ".zip";
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
      btn.disabled = false; btn.textContent = old;
    });
  }).catch(function (e) {
    btn.disabled = false; btn.textContent = old;
    alert(e.message || "내려받지 못했습니다.");
  });
}

/* 교사: HTML / 자료 제출물 보기 (추가) — 샌드박스 iframe 안에서만 실행합니다 */
function openHtmlSub(id, label) {
  $("#modal").innerHTML = '<div class="modal"><div class="mbox wide"><p>불러오는 중…</p></div></div>';
  sb.from("submissions").select("html,payload").eq("id", id).single().then(function (r) {
    if (r.error || !r.data) { $("#modal").innerHTML = ""; alert("불러오지 못했습니다."); return; }
    var d = r.data;
    $("#modal").innerHTML =
      '<div class="modal"><div class="mbox wide"><p>' + esc(label) + '</p>' +
      (d.html ? '<div id="mholder"></div>' : '') +
      (d.payload ? '<pre>' + esc(JSON.stringify(d.payload, null, 2)) + '</pre>' : '') +
      '<div class="row" style="margin-top:12px;justify-content:center">' +
      (d.html ? '<button class="btn-s" id="dl" style="background:#fff">HTML 내려받기</button>' : '') +
      '<button class="btn-p" id="close">닫기</button></div></div></div>';
    if (d.html) mountFrame("#mholder", d.html, "학생 제출 HTML");
    on("#close", "click", function () { $("#modal").innerHTML = ""; });
    on("#dl", "click", function () {
      /* 새 탭에서 열지 않고 파일로만 받습니다 (새 탭은 이 사이트 권한으로 실행될 수 있어 위험) */
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([d.html], { type: "application/octet-stream" }));
      a.download = (label.split(" · ").slice(0, 2).join("_") || "submission").replace(/[\\/:*?"<>|]/g, "") + ".html";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    });
  });
}

/* 엑셀 도구 받아 오기 */
function ensureXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise(function (res, rej) {
    var sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
    sc.onload = function () { res(window.XLSX); };
    sc.onerror = function () { rej(new Error("엑셀 도구를 불러오지 못했습니다.")); };
    document.head.appendChild(sc);
  });
}

/* 명단 작성용 양식 내려받기 */
function downloadRosterForm(btn) {
  var old = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; btn.textContent = "만드는 중…"; }
  var title = (ST.space && ST.space.title ? ST.space.title : "과제공간").replace(/[\\/:*?"<>|]/g, "");
  var rows = [["이름", "비밀번호"], ["홍길동", "2401"], ["김영희", "2402"]];
  for (var i = 0; i < 40; i++) rows.push(["", ""]);

  var done = function () { if (btn) { btn.disabled = false; btn.textContent = old; } };
  var save = function (href, name) {
    var a = document.createElement("a");
    a.href = href; a.download = name; a.click();
    setTimeout(function () { if (href.indexOf("blob:") === 0) URL.revokeObjectURL(href); }, 1500);
  };

  ensureXLSX().then(function (XLSX) {
    var ws = XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"] = [{ wch: 18 }, { wch: 14 }];
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "학생명단");
    XLSX.writeFile(wb, title + "_학생명단_양식.xlsx");
    done();
  }).catch(function () {
    var csv = "\uFEFF" + rows.map(function (r) { return r.join(","); }).join("\n");
    save(URL.createObjectURL(new Blob([csv], { type: "text/csv" })), title + "_학생명단_양식.csv");
    done();
  });
}

/* 붙여넣은 글에서 명단 뽑기 */
function parseRosterText(text) {
  var out = [];
  String(text || "").split(/\r?\n/).forEach(function (line) {
    var t = line.trim();
    if (!t) return;
    var parts = t.split(/[,\t;]/);
    var nm = (parts[0] || "").trim();
    var pin = (parts[1] || "").trim() || "1234";
    if (!nm) return;
    if (/^(이름|성명|학생|name)$/i.test(nm)) return;          /* 머리글 줄은 건너뜁니다 */
    out.push({ name: nm, pin: pin });
  });
  return out;
}

/* 엑셀·CSV 파일에서 명단 뽑기 */
function readRosterFile(file) {
  if (/\.csv$/i.test(file.name) || file.type === "text/csv") {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { res(parseRosterText(String(r.result))); };
      r.onerror = function () { rej(new Error("파일을 읽지 못했습니다.")); };
      r.readAsText(file, "utf-8");
    });
  }
  return new Promise(function (res, rej) {
    var go = function () {
      var r = new FileReader();
      r.onload = function () {
        try {
          var wb = window.XLSX.read(new Uint8Array(r.result), { type: "array" });
          var sh = wb.Sheets[wb.SheetNames[0]];
          var rows = window.XLSX.utils.sheet_to_json(sh, { header: 1, blankrows: false });
          var out = [];
          rows.forEach(function (row) {
            var nm = String(row[0] == null ? "" : row[0]).trim();
            var pin = String(row[1] == null ? "" : row[1]).trim() || "1234";
            if (!nm || /^(이름|성명|학생|name)$/i.test(nm)) return;
            out.push({ name: nm, pin: pin });
          });
          res(out);
        } catch (e) { rej(new Error("엑셀 파일을 읽지 못했습니다.")); }
      };
      r.onerror = function () { rej(new Error("파일을 읽지 못했습니다.")); };
      r.readAsArrayBuffer(file);
    };
    ensureXLSX().then(go).catch(function () {
      rej(new Error("엑셀 도구를 불러오지 못했습니다. CSV 로 저장해 올려 주세요."));
    });
  });
}

  box.innerHTML =
    '<div class="banner">' + rows.length + '명을 읽었습니다' +
    (bad.length ? ' · 비밀번호가 짧은 ' + bad.length + '명은 등록되지 않습니다 (' +
      bad.slice(0, 5).map(function (r) { return esc(r.name); }).join(", ") + (bad.length > 5 ? " 외" : "") + ')' : '') +
    ' — 아래 칸에서 고친 뒤 등록하세요.</div>';
}

/* ── 학생 명단 (교사용) ──────────────────────────────── */
function panelStudents() {
  Promise.all([
    sb.from("students").select("id,name,created_at,last_seen").eq("space_code", ST.space.code).order("name"),
    sb.from("apps").select("id,title,position").eq("space_code", ST.space.code),
    sb.from("submissions").select("student_id,app_id").eq("space_code", ST.space.code).limit(3000)
  ]).then(function (res) {
      var r = res[0];
      var apps = sortApps(res[1].data || []);
      var subs = res[2].data || [];
      var rows = r.data || [];
      var seen = {};
      subs.forEach(function (x) {
        if (!x.student_id || !x.app_id) return;
        var k = x.student_id + "|" + x.app_id;
        seen[k] = (seen[k] || 0) + 1;
      });
      var matrix = "";
      if (rows.length && apps.length) {
        matrix =
          '<div class="card"><h2>제출 현황</h2>' +
          '<p class="hint">학생이 과제별로 결과를 보냈는지 보여 줍니다. 숫자는 보낸 횟수입니다.</p>' +
          '<div class="mwrap"><table class="matrix"><thead><tr><th>학생</th>' +
          apps.map(function (a) { return '<th>' + esc(a.title) + '</th>'; }).join("") +
          '<th>합계</th></tr></thead><tbody>' +
          rows.map(function (st) {
            var done = 0;
            var cells = apps.map(function (a) {
              var c = seen[st.id + "|" + a.id] || 0;
              if (c) done++;
              return '<td class="' + (c ? "yes" : "no") + '">' + (c ? (c > 1 ? c : "✓") : "·") + '</td>';
            }).join("");
            return '<tr><th class="nm">' + esc(st.name) + '</th>' + cells +
              '<td class="sum">' + done + '/' + apps.length + '</td></tr>';
          }).join("") + '</tbody></table></div></div>';
      }
      $("#panel").innerHTML = matrix +
        '<div class="card"><h2>학생 명단 <span class="num">' + rows.length + '</span></h2>' +
        '<p class="hint">학생이 처음 들어올 때 정한 이름입니다. 비밀번호를 잊은 학생은 지워 주세요. ' +
        '지우면 그 이름으로 다시 등록할 수 있고, 이미 보낸 결과는 그대로 남습니다.</p>' +
        (rows.length
          ? rows.map(function (st) {
              return '<div class="item"><div class="grow"><div class="t">' + esc(st.name) + '</div>' +
                '<div class="m">마지막 접속 ' + fmt(st.last_seen) + '</div></div>' +
                '<button class="btn-d stdel" data-id="' + st.id + '">비밀번호 초기화</button></div>';
            }).join("")
          : '<div class="empty">아직 등록한 학생이 없습니다.</div>') + '</div>' +
        '<div class="card"><h2>명단 미리 등록</h2>' +
        '<p class="hint">엑셀 파일을 올리거나, 한 줄에 한 명씩 <b>이름, 비밀번호</b> 로 붙여넣으세요. ' +
        '비밀번호를 빼면 1234 로 넣고, 이미 있는 이름은 비밀번호만 새로 바뀝니다. ' +
        '양식 받기로 엑셀 파일을 내려받아 채워 올리시면 가장 간편합니다. 예시 두 줄은 지우고 쓰세요.</p>' +
        '<div class="row" style="margin-bottom:12px">' +
          '<button class="btn-s" id="dlForm">양식 받기</button>' +
          '<button class="btn-s" id="pickXls">엑셀·CSV 파일 고르기</button>' +
          '<span class="m" id="xlsName"></span></div>' +
        '<input type="file" id="xlsFile" accept=".xlsx,.xls,.csv,text/csv" style="display:none">' +
        '<textarea id="roster" style="min-height:120px" placeholder="김민서, 2401\n이준호, 2402\n박서윤"></textarea>' +
        '<div id="rpreview"></div>' +
        '<label class="dl" style="margin-bottom:12px"><input type="checkbox" id="rlock"' +
        (ST.space.roster_locked ? ' checked' : '') + '> 명단에 없는 이름은 들어오지 못하게 하기</label>' +
        '<div class="err" id="err"></div><div class="ok" id="rok"></div>' +
        '<button class="btn-p" id="rgo">명단 등록</button></div>';

      on("#rlock", "change", function () {
        var v = $("#rlock").checked;
        sb.from("spaces").update({ roster_locked: v }).eq("code", ST.space.code).then(function (rr) {
          if (rr.error) { $("#rlock").checked = !v; return alert("바꾸지 못했습니다: " + rr.error.message); }
          ST.space.roster_locked = v;
        });
      });

      on("#dlForm", "click", function (e) { downloadRosterForm(e.target); });
      on("#pickXls", "click", function () { $("#xlsFile").click(); });
      on("#xlsFile", "change", function (e) {
        var f = e.target.files[0]; e.target.value = "";
        if (!f) return;
        $("#xlsName").textContent = f.name;
        readRosterFile(f).then(function (rows) {
          $("#roster").value = rows.map(function (r) { return r.name + ", " + r.pin; }).join("\n");
          showRosterPreview(rows);
        }).catch(function (err) { setErr(err.message || "파일을 읽지 못했습니다."); });
      });
      on("#roster", "input", function () { $("#rpreview").innerHTML = ""; });

      on("#rgo", "click", function () {
        var rows = parseRosterText($("#roster").value);
        if (!rows.length) return setErr("명단을 붙여넣거나 파일을 올리세요.");
        var btn = $("#rgo"); btn.disabled = true; btn.textContent = "등록 중…"; setErr("");
        $("#rok").textContent = "";

        sb.rpc("student_preregister_bulk", { c: ST.space.code, items: rows }).then(function (rr) {
          btn.disabled = false; btn.textContent = "명단 등록";
          if (rr.error) {
            setErr("등록하지 못했습니다: " + rr.error.message +
              " — patch-roster.sql 을 Supabase 에서 실행했는지 확인해 주세요.");
            return;
          }
          var res = (rr.data || []).map(function (x) {
            return { name: x.out_name || x.name, status: x.out_status || x.status };
          });
          var okN = res.filter(function (x) { return x.status === "OK"; }).length;
          var bad = res.filter(function (x) { return x.status !== "OK"; });
          var why = { EMPTY: "이름이 비어 있음", SHORTPIN: "비밀번호가 네 자리 미만" };
          if (bad.length) {
            setErr(bad.map(function (x) {
              return x.name + " — " + (why[x.status] || x.status);
            }).join(" / "));
          }
          $("#rok").textContent = okN + "명 등록했습니다." + (bad.length ? " (" + bad.length + "명 실패)" : "");
          setTimeout(panelStudents, 900);
        });
      });

      app.querySelectorAll(".stdel").forEach(function (b) {
        b.addEventListener("click", function () {
          if (b.textContent === "비밀번호 초기화") { b.textContent = "정말 초기화"; return; }
          b.disabled = true;
          sb.from("students").delete().eq("id", b.dataset.id).then(function (rr) {
            if (rr.error) { b.disabled = false; b.textContent = "비밀번호 초기화"; alert("지우지 못했습니다: " + rr.error.message); return; }
            panelStudents();
          });
        });
      });
    });
}

/* ── 학생 ───────────────────────────────────────────────── */
function studentEnter(code) {
  render('<div class="card"><div class="empty">과제 공간을 찾는 중…</div></div>');
  sb.rpc("space_info", { c: code }).then(function (r) {
    r.data = (r.data || [])[0];
    if (!r.data) {
      render('<div class="card"><h2>공간을 찾을 수 없습니다</h2>' +
        '<p class="hint">코드가 맞는지 선생님께 다시 확인해 주세요.</p>' +
        '<button class="btn-p" id="home">처음으로</button></div>');
      on("#home", "click", goHome);
      return;
    }
    ST.space = r.data;
    if (r.data.mode === "open") { ST.student = null; ST.studentId = null; studentApps(); return; }
    var saved = null;
    try { saved = localStorage.getItem("mt-stu-" + ST.space.code); } catch (e) { }
    if (saved) {
      render('<div class="card"><div class="empty">이어서 들어가는 중…</div></div>');
      sb.rpc("student_resume", { c: ST.space.code, tok: saved }).then(function (rr) {
        var me = (rr.data || [])[0];
        if (me) { ST.student = me.name; ST.studentId = me.token; studentApps(); }
        else { try { localStorage.removeItem("mt-stu-" + ST.space.code); } catch (e) { } studentGate(); }
      });
      return;
    }
    studentGate();
  });
}

function studentGate() {
  render(
    '<div class="card"><h2>' + esc(ST.space.title) + '</h2>' +
      '<p class="hint">' + esc(ST.space.teacher_name || "선생님") + '의 과제 공간입니다. ' +
      '이름과 네 자리 비밀번호를 적으세요. 처음이면 그대로 등록되고, 다음부터는 같은 번호로 들어와 ' +
      '내가 보낸 것들을 볼 수 있습니다.</p>' +
      '<label>이름</label><input type="text" id="name" placeholder="예: 3학년 2반 김민서">' +
      '<label>네 자리 비밀번호</label>' +
      '<input type="text" id="pin" inputmode="numeric" maxlength="8" placeholder="숫자 네 자리" ' +
      'style="font-family:var(--mono);letter-spacing:6px">' +
      '<label class="dl" style="font-size:12.5px;color:var(--ink2);margin-bottom:12px">' +
      '<input type="checkbox" id="keep" checked> 이 기기에서는 다음부터 바로 들어가기</label>' +
      '<div class="err" id="err"></div>' +
      '<button class="btn-g" id="go">들어가기</button></div>');

  var go = function () {
    var name = $("#name").value.trim(), pin = $("#pin").value.trim();
    if (!name) return setErr("이름을 입력하세요.");
    if (pin.length < 4) return setErr("비밀번호는 네 자리 이상입니다.");
    $("#go").disabled = true; setErr("");
    sb.rpc("student_join", { c: ST.space.code, nm: name, pin: pin }).then(function (rr) {
      $("#go").disabled = false;
      if (rr.error) {
        var m = rr.error.message || "";
        if (m.indexOf("BADPIN") >= 0) return setErr("이미 쓰고 있는 이름입니다. 비밀번호가 다르면 선생님께 말씀드리세요.");
        if (m.indexOf("NOTINROSTER") >= 0) return setErr("명단에 없는 이름입니다. 선생님께 확인해 주세요.");
        return setErr("들어가지 못했습니다: " + m);
      }
      var me = (rr.data || [])[0];
      if (!me) return setErr("들어가지 못했습니다. 다시 시도하세요.");
      ST.student = me.name; ST.studentId = me.token;
      if ($("#keep").checked) {
        try { localStorage.setItem("mt-stu-" + ST.space.code, me.token); } catch (e) { }
      }
      studentApps();
    });
  };
  on("#go", "click", go);
  on("#pin", "keydown", function (e) { if (e.key === "Enter") go(); });
}

function studentApps() {
  if (ST.msgFn) { window.removeEventListener("message", ST.msgFn); ST.msgFn = null; }
  render('<div class="card"><div class="empty">과제를 불러오는 중…</div></div>');
  sb.rpc("space_apps", { c: ST.space.code }).then(function (r) {
    ST.apps = sortApps(r.data || []);
    render(
      '<div class="between"><span class="m">' + esc(ST.space.title) + '</span>' +
        (ST.studentId
          ? '<span class="row" style="gap:8px;align-items:center">' +
            '<span class="m">' + esc(ST.student) + '</span>' +
            '<button class="btn-s" id="mine">내 제출 이력</button>' +
            '<button class="btn-d" id="leave">나가기</button></span>'
          : '<span class="m">공개용</span>') + '</div>' +
      '<div class="card"><h2>과제 목록</h2><p class="hint">과제를 골라 여세요.</p>' +
      (ST.apps.length
        ? (function () {
            var n = 0, gs = groupByFolder(ST.apps);
            var one = gs.length === 1 && gs[0].plain;
            return gs.map(function (g, gi) {
              var body = g.rows.map(function (a) {
                n++;
                return '<div class="item"><span class="num">' + String(n).padStart(2, "0") + '</span>' +
                  '<div class="grow"><div class="t">' + esc(a.title) + '</div>' +
                  (a.note ? '<div class="note">' + esc(a.note) + '</div>' : '') + '</div>' +
                  '<button class="btn-p open" data-id="' + a.id + '">열기</button></div>';
              }).join("");
              if (one) return body;
              return '<button class="ftog" data-i="' + gi + '"><span>▾ ' + esc(g.label) + '</span>' +
                '<b>' + g.rows.length + '개</b></button>' +
                '<div class="fbody" id="fb' + gi + '">' + body + '</div>';
            }).join("");
          })()
        : '<div class="empty">아직 올라온 과제가 없습니다.</div>') + '</div>');
    on("#mine", "click", studentHistory);
    on("#leave", "click", function () {
      try { localStorage.removeItem("mt-stu-" + ST.space.code); } catch (e) { }
      ST.student = null; ST.studentId = null; studentGate();
    });
    app.querySelectorAll(".ftog").forEach(function (b) {
      b.addEventListener("click", function () {
        var body = $("#fb" + b.dataset.i);
        var open = body.style.display !== "none";
        body.style.display = open ? "none" : "block";
        var lab = b.querySelector("span");
        lab.textContent = (open ? "▸ " : "▾ ") + lab.textContent.slice(2);
      });
    });
    app.querySelectorAll(".open").forEach(function (b) {
      b.addEventListener("click", function () { studentOpen(b.dataset.id); });
    });
  });
}

function studentHistory() {
  render('<div class="card"><div class="empty">내가 보낸 것을 찾는 중…</div></div>');
  sb.rpc("student_history", { tok: ST.studentId }).then(function (r) {
    var rows = r.data || [];
    var url = function (p) { return sb.storage.from("submissions").getPublicUrl(p).data.publicUrl; };
    render(
      '<div class="between"><button class="btn-s" id="back">← 과제 목록</button>' +
        '<span class="m">' + esc(ST.student) + '</span></div>' +
      '<div class="card"><h2>내가 보낸 것 <span class="num">' + rows.length + '</span></h2>' +
      '<p class="hint">선생님께 보낸 결과입니다. 눌러서 다시 볼 수 있습니다.</p>' +
      (rows.length
        ? groupByDay(rows).map(function (g) {
            return '<div class="dayhead">' + esc(g.label) + '<b>' + g.rows.length + '건</b></div>' +
              g.rows.map(function (h) {
                var kind = h.image_path ? "사진" : h.html_len ? "HTML" : h.has_payload ? "기록" : "";
                return '<div class="item"><span class="num">' + esc(kind) + '</span>' +
                  '<div class="grow"><div class="t">' + esc(h.app_title || "과제") + '</div>' +
                  (h.note ? '<div class="m">' + esc(h.note) + '</div>' : '') + '</div>' +
                  '<div class="m">' + hm(h.created_at) + '</div>' +
                  '<button class="btn-s hopen" data-id="' + h.id + '" data-p="' + esc(h.image_path || "") + '">다시 보기</button></div>';
              }).join("");
          }).join("")
        : '<div class="empty">아직 보낸 것이 없습니다.<br>과제를 열고 결과를 보내 보세요.</div>') +
      '</div><div id="modal"></div>');

    on("#back", "click", studentApps);
    app.querySelectorAll(".hopen").forEach(function (b) {
      b.addEventListener("click", function () {
        if (b.dataset.p) {
          $("#modal").innerHTML =
            '<div class="modal"><div class="mbox"><p>내가 보낸 사진</p>' +
            '<img src="' + esc(url(b.dataset.p)) + '" alt="내가 보낸 결과">' +
            '<div style="margin-top:12px"><button class="btn-p" id="close">닫기</button></div></div></div>';
          on("#close", "click", function () { $("#modal").innerHTML = ""; });
          return;
        }
        sb.rpc("student_submission", { tok: ST.studentId, sub: b.dataset.id }).then(function (rr) {
          var d = (rr.data || [])[0];
          if (!d) return;
          var body = d.html ? d.html
            : '<pre style="font-family:monospace;font-size:13px;white-space:pre-wrap;padding:16px">' +
              esc(JSON.stringify(d.payload, null, 2)) + '</pre>';
          $("#modal").innerHTML =
            '<div class="modal"><div class="mbox"><p>' + esc(d.app_title || "과제") + '</p>' +
            '<div id="holder"></div><div style="margin-top:12px">' +
            '<button class="btn-p" id="close">닫기</button></div></div></div>';
          mountFrame("#holder", body, d.app_title || "제출물");
          on("#close", "click", function () { $("#modal").innerHTML = ""; });
        });
      });
    });
  });
}

function studentOpen(id) {
  sb.rpc("app_html", { p_id: id, p_code: ST.space.code }).then(function (r) {
    var a = (r.data || [])[0];
    if (!a) return;
    render(
      '<div class="between"><button class="btn-s" id="back">← 과제 목록</button>' +
        '<span class="t">' + esc(a.title) + '</span>' +
        '<button class="btn-s" id="full">전체 화면</button></div>' +
      (function () {
        var cur = (ST.apps || []).filter(function (x) { return x.id === a.id; })[0];

      })() +
      '<div id="holder"></div>' +
      (ST.studentId ? '' : '<!--noSend-->') +
      '<div class="card" style="margin-top:14px"' + (ST.studentId ? '' : ' hidden') + '>' +
        '<button class="btn-g toggle" id="toggle">선생님께 결과 보내기<span id="arrow">▼ 열기</span></button>' +
        '<div id="send" style="display:none;margin-top:16px">' +
          '<p class="hint">완성한 화면을 캡처해서 올리세요. 휴대폰은 화면 캡처, 컴퓨터는 캡처 후 붙여넣기가 편합니다.</p>' +
          '<div class="drop" id="drop">캡처 이미지를 여기에 붙여넣기(Ctrl+V)하거나 끌어다 놓으세요' +

          '<input type="file" id="file" accept="image/*" style="display:none">' +
          '<div class="sendsec"><h3>HTML 코드 또는 파일로 보내기</h3>' +
            '<p class="hint">과제에서 내려받은 HTML 파일, 직접 만든 HTML, 그 밖의 파일(PDF·문서·그림 등)을 보낼 수 있습니다. ' +
            'HTML 은 선생님이 작동하는 화면 그대로 보고, 다른 파일은 받아서 엽니다.</p>' +
            '<div class="row" style="margin-bottom:12px"><button class="btn-s" id="pickHtml">파일 고르기</button>' +
            '<span class="m" id="htmlName"></span></div>' +
            '<input type="file" id="htmlFile" style="display:none">' +
            '<button class="btn-s toggle" id="pasteToggle" style="width:100%;margin-bottom:12px">' +
              'HTML 코드 붙여넣기<span id="pasteArrow">▼ 열기</span></button>' +
            '<div id="pasteBox" style="display:none;margin-bottom:12px">' +
              '<p class="hint">과제 화면에서 코드를 복사했거나 직접 쓴 코드가 있으면 여기에 붙여넣으세요.</p>' +
              '<textarea id="htmlPaste" placeholder="<!DOCTYPE html> …"></textarea>' +
              '<button class="btn-g" id="sendPaste">붙여넣은 코드 보내기</button></div></div>' +
          '<label>한마디 (선택)</label>' +
          '<input type="text" id="note" placeholder="예: 두 번째 문제가 헷갈렸어요">' +
          '<div class="err" id="err"></div><div class="ok" id="ok"></div></div></div>');
    mountFrame("#holder", a.html, a.title);
    on("#back", "click", studentApps);
    on("#full", "click", function () {
      var fr = app.querySelector("#holder iframe");
      if (!fr) return;
      if (fr.requestFullscreen) fr.requestFullscreen();
      else if (fr.webkitRequestFullscreen) fr.webkitRequestFullscreen();
      else fr.scrollIntoView({ block: "start" });
    });
    on("#toggle", "click", function () {
      var box = $("#send"), open = box.style.display === "none";
      box.style.display = open ? "block" : "none";
      $("#arrow").textContent = open ? "▲ 접기" : "▼ 열기";
      if (open) box.scrollIntoView({ behavior: "smooth", block: "nearest" });
    });
    wirePicker(function (file) { sendResult(file, a); });
    wireHtmlSend(a);
    listenTaskSubmit(a);
  });
}

/* ── HTML 제출 (추가) ─────────────────────────────────────── */
var HTML_MAX = 500000;   /* 약 500KB. Supabase 의 check 제약과 같이 맞춥니다 */

function wireHtmlSend(appRow) {
  var btn = $("#pickHtml"), input = $("#htmlFile");
  if (!btn) return;
  btn.addEventListener("click", function () { input.click(); });
  input.addEventListener("change", function () {
    var f = input.files[0]; input.value = "";
    if (!f) return;
    if (/\.html?$/i.test(f.name) || f.type === "text/html") {
      var r = new FileReader();
      r.onload = function () { $("#htmlName").textContent = f.name; sendHtml(String(r.result), null, appRow, btn); };
      r.onerror = function () { setErr("파일을 읽지 못했습니다."); };
      r.readAsText(f, "utf-8");
      return;
    }
    $("#htmlName").textContent = f.name;
    sendFile(f, appRow, btn);
  });
  on("#pasteToggle", "click", function () {
    var box = $("#pasteBox"), open = box.style.display === "none";
    box.style.display = open ? "block" : "none";
    $("#pasteArrow").textContent = open ? "▲ 접기" : "▼ 열기";
    if (open) $("#htmlPaste").focus();
  });
  on("#sendPaste", "click", function (e) {
    sendHtml($("#htmlPaste").value, null, appRow, e.target);
  });
}

function sendHtml(html, payload, appRow, btn) {
  var ok = $("#ok");
  html = html == null ? null : String(html);
  setErr(""); if (ok) ok.textContent = "";
  if (html !== null && !html.trim()) { setErr("보낼 HTML 이 비어 있습니다."); return Promise.resolve(false); }
  if (html !== null && html.length > HTML_MAX) {
    setErr("HTML 이 너무 큽니다(" + Math.round(html.length / 1000) + "KB). 이미지는 줄이거나 빼고 다시 보내세요.");
    return Promise.resolve(false);
  }
  var old = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; btn.textContent = "보내는 중…"; }
  return sb.from("submissions").insert({
    space_code: ST.space.code, app_id: appRow.id, app_title: appRow.title,
    student_name: ST.student, student_id: ST.studentId || null,
    image_path: null, html: html, payload: payload || null,
    note: ($("#note") && $("#note").value.trim()) || null
  }).then(function (res) {
    if (btn) { btn.disabled = false; btn.textContent = old; }
    if (res.error) { setErr("보내지 못했습니다: " + res.error.message); return false; }
    if (ok) ok.textContent = "선생님께 보냈습니다.";
    if ($("#note")) $("#note").value = "";
    if ($("#htmlPaste")) $("#htmlPaste").value = "";
    return true;
  });
}

/* 과제 HTML 안에서 parent.postMessage({ type: "mathtaskSubmit", html, data }, "*") 로 보내면 받습니다 */
function listenTaskSubmit(appRow) {
  if (ST.msgFn) window.removeEventListener("message", ST.msgFn);
  ST.msgFn = function (e) {
    var fr = app.querySelector("#holder iframe");
    if (!fr || e.source !== fr.contentWindow) return;          /* 지금 열린 과제에서 온 것만 */
    var d = e.data;
    if (!d || d.type !== "mathtaskSubmit") return;
    var reply = function (r) { try { fr.contentWindow.postMessage({ type: "mathtaskSubmitResult", ok: r }, "*"); } catch (x) { } };
    if (!ST.studentId) return reply(false);                     /* 공개용 공간은 제출을 받지 않습니다 */
    if (!confirm("과제 결과를 선생님께 보낼까요?")) return reply(false);
    var html = typeof d.html === "string" ? d.html : null;
    var payload = null;
    if (d.data !== undefined) {
      try { payload = JSON.parse(JSON.stringify(d.data)); } catch (x) { payload = null; }
      if (payload && JSON.stringify(payload).length > HTML_MAX) { setErr("보낼 자료가 너무 큽니다."); return reply(false); }
    }
    if (html === null && payload === null) return reply(false);
    sendHtml(html, payload, appRow, null).then(reply);
  };
  window.addEventListener("message", ST.msgFn);
}

/* 그림·문서 등 파일 그대로 보내기 */
function sendFile(file, appRow, btn) {
  var ok = $("#ok"), old = btn ? btn.textContent : "";
  setErr(""); if (ok) ok.textContent = "";
  if (file.size > 12 * 1024 * 1024) return setErr("파일이 너무 큽니다. 12MB 이하로 보내 주세요.");
  if (btn) { btn.disabled = true; btn.textContent = "보내는 중…"; }
  var ext = (file.name.match(/\.[A-Za-z0-9]+$/) || [""])[0];
  var path = ST.space.code + "/" +
    (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(36).slice(2)) + ext;

  sb.storage.from("submissions").upload(path, file, { contentType: file.type || "application/octet-stream" })
    .then(function (up) {
      if (up.error) throw new Error(up.error.message);
      return sb.from("submissions").insert({
        space_code: ST.space.code, app_id: appRow.id, app_title: appRow.title,
        student_name: ST.student, student_id: ST.studentId || null,
        image_path: path, file_name: file.name,
        note: ($("#note") && $("#note").value.trim()) || null
      });
    }).then(function (res) {
      if (btn) { btn.disabled = false; btn.textContent = old; }
      if (res && res.error) return setErr("보내지 못했습니다: " + res.error.message);
      if (ok) ok.textContent = "선생님께 보냈습니다.";
      if ($("#note")) $("#note").value = "";
    }).catch(function (e) {
      if (btn) { btn.disabled = false; btn.textContent = old; }
      setErr(e.message || "보내지 못했습니다. 다시 시도하세요.");
    });
}

function sendResult(file, appRow) {
  var pick = $("#pick"), ok = $("#ok");
  pick.disabled = true; pick.textContent = "보내는 중…"; setErr(""); ok.textContent = "";
  compress(file).then(function (blob) {
    var path = ST.space.code + "/" + (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(36).slice(2)) + ".jpg";
    return sb.storage.from("submissions").upload(path, blob, { contentType: "image/jpeg" })
      .then(function (up) {
        if (up.error) throw new Error(up.error.message);
        return sb.from("submissions").insert({
          space_code: ST.space.code, app_id: appRow.id, app_title: appRow.title,
          student_name: ST.student, student_id: ST.studentId || null,
          image_path: path, note: $("#note").value.trim() || null
        });
      });
  }).then(function (res) {
    pick.disabled = false; pick.textContent = "사진 고르기";
    if (res && res.error) return setErr("보내지 못했습니다: " + res.error.message);
    ok.textContent = "선생님께 보냈습니다.";
    $("#note").value = "";
  }).catch(function (e) {
    pick.disabled = false; pick.textContent = "사진 고르기";
    setErr(e.message || "보내지 못했습니다. 다시 시도하세요.");
  });
}

boot();
</script>
